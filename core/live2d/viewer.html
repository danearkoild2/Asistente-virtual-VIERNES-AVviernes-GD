<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Edith Live2D Pro Autonomous Engine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      user-select: none;
      -webkit-user-select: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
    }
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #A0A0AB;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.3px;
      background: transparent;
      z-index: 100;
      transition: opacity 0.35s ease;
      pointer-events: none;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid rgba(110, 106, 246, 0.22);
      border-top-color: #6E6AF6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 10px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #debug-hud {
      display: none;
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 8px 12px;
      background: rgba(5, 15, 25, 0.85);
      border: 1px solid rgba(255, 148, 194, 0.4);
      border-radius: 4px;
      color: #e0f0ff;
      font-family: monospace;
      font-size: 11px;
      line-height: 1.4;
      pointer-events: none;
      z-index: 90;
    }
    #firefly-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
      pointer-events: none;
      z-index: 45;
    }
  </style>

  <script src="lib/live2dcubismcore.min.js"></script>
  <script src="lib/pixi.min.js"></script>
  <script src="lib/cubism4.min.js"></script>
</head>
<body>
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text">Preparando presencia…</div>
  </div>

  <div id="debug-hud"></div>

  <div id="canvas-container">
    <canvas id="canvas"></canvas>
    <canvas id="firefly-canvas"></canvas>
  </div>

  <script>
    // ══════════════════════════════════════════════════════════════════════════
    // 1. SISTEMA EMOCIONAL AVANZADO (EdithEmotionEngine)
    // ══════════════════════════════════════════════════════════════════════════
    class EdithEmotionEngine {
      constructor() {
        this.currentEmotion = 'neutral';
        this.intensity = 1.0;
        this.duration = 0.0;
        this.elapsed = 0.0;
        this.autoDecay = true;

        // Current blended output parameter values
        this.current = {
          eyeHappy: 0.0,
          eyeAngry: 0.0,
          eyeSmile: 0.0,
          eyeOpenOffset: 0.0,
          eyeSquint: 0.0,
          eyeCircles: 0.0,
          browY: 0.0,
          browAngle: 0.0,
          browForm: 0.0,
          browAsymY: 0.0, // for confusion/curiosity
          mouthForm: 0.25,
          mouthOpenOffset: 0.0,
          mouthX: 0.0,
          cheek: 0.20,
          cheekPuff: 0.0,
          tongueOut: 0.0,
          expression1: 0.0, // tears
          expression2: 0.0, // sweat/teardrop
          expression3: 0.0, // happy squint ^^
          expression4: 0.0, // >< squint
          headTiltOffset: 0.0,
          headPitchOffset: 0.0,
          bodyLeanOffset: 0.0
        };

        // Targets for smooth interpolation
        this.target = Object.assign({}, this.current);
      }

      setEmotion(name, intensity = 1.0, duration = 0.0) {
        name = String(name || 'neutral').toLowerCase().trim();
        this.currentEmotion = name;
        this.intensity = Math.max(0.0, Math.min(1.0, Number(intensity) || 1.0));
        this.duration = Number(duration) || 0.0;
        this.elapsed = 0.0;
        this.autoDecay = (this.duration > 0.0);

        this.applyEmotionTargets(name, this.intensity);
      }

      applyEmotionTargets(name, k) {
        // Reset base targets
        const t = {
          eyeHappy: 0.0,
          eyeAngry: 0.0,
          eyeSmile: 0.0,
          eyeOpenOffset: 0.0,
          eyeSquint: 0.0,
          eyeCircles: 0.0,
          browY: 0.0,
          browAngle: 0.0,
          browForm: 0.0,
          browAsymY: 0.0,
          mouthForm: 0.20,
          mouthOpenOffset: 0.0,
          mouthX: 0.0,
          cheek: 0.20,
          cheekPuff: 0.0,
          tongueOut: 0.0,
          expression1: 0.0,
          expression2: 0.0,
          expression3: 0.0,
          expression4: 0.0,
          headTiltOffset: 0.0,
          headPitchOffset: 0.0,
          bodyLeanOffset: 0.0
        };

        switch (name) {
          case 'happy':
          case 'happiness':
            t.eyeHappy = 0.85 * k;
            t.eyeSmile = 0.70 * k;
            t.mouthForm = 0.85 * k;
            t.cheek = 0.35 + 0.35 * k;
            t.browY = 0.25 * k;
            t.headPitchOffset = 3.5 * k;
            t.bodyLeanOffset = 0.2 * k;
            break;

          case 'sad':
          case 'sadness':
            t.browY = -0.55 * k;
            t.browAngle = 0.45 * k;
            t.mouthForm = -0.65 * k;
            t.eyeOpenOffset = -0.30 * k;
            t.cheek = 0.10;
            t.headPitchOffset = -8.0 * k;
            t.headTiltOffset = -3.0 * k;
            t.bodyLeanOffset = -0.3 * k;
            if (k > 0.75) t.expression1 = 0.7 * k; // subtle tears
            break;

          case 'angry':
          case 'anger':
            t.eyeAngry = 0.80 * k;
            t.browY = -0.45 * k;
            t.browAngle = -0.65 * k;
            t.mouthForm = -0.50 * k;
            t.cheekPuff = 0.45 * k;
            t.headPitchOffset = -3.0 * k;
            break;

          case 'shy':
          case 'embarrassed':
            t.cheek = 0.75 + 0.25 * k; // intense cute blush
            t.eyeSmile = 0.40 * k;
            t.mouthForm = 0.35 * k;
            t.headTiltOffset = 6.5 * k;
            t.headPitchOffset = -5.0 * k;
            t.eyeOpenOffset = -0.15 * k;
            if (k > 0.65) t.expression2 = 0.8 * k; // sweat/teardrop
            break;

          case 'surprised':
          case 'surprise':
            t.eyeOpenOffset = 0.45 * k; // wide open eyes
            t.browY = 0.85 * k;
            t.mouthOpenOffset = 0.38 * k;
            t.mouthForm = 0.10;
            t.headPitchOffset = 4.0 * k;
            t.bodyLeanOffset = -0.4 * k; // recoil back
            break;

          case 'curious':
          case 'curiosity':
            t.headTiltOffset = -11.0 * k; // curious head tilt
            t.browAsymY = 0.45 * k;
            t.browY = 0.20 * k;
            t.eyeOpenOffset = 0.15 * k;
            t.mouthForm = 0.35 * k;
            t.bodyLeanOffset = 0.35 * k; // lean forward
            break;

          case 'bored':
          case 'boredom':
            t.eyeOpenOffset = -0.35 * k; // half-lidded
            t.browY = -0.20 * k;
            t.mouthForm = -0.25 * k;
            t.cheekPuff = 0.35 * k;
            t.headTiltOffset = 4.5 * k;
            t.headPitchOffset = -4.0 * k;
            break;

          case 'confused':
          case 'confusion':
            t.headTiltOffset = 9.5 * k;
            t.browAsymY = 0.70 * k; // asymmetric eyebrows
            t.browY = 0.10;
            t.mouthX = 0.30 * k;
            t.mouthForm = -0.15 * k;
            if (k > 0.8) t.eyeCircles = 0.65 * k;
            break;

          case 'proud':
          case 'satisfied':
            t.headPitchOffset = 5.5 * k; // chin up
            t.bodyLeanOffset = 0.3 * k;
            t.eyeHappy = 0.90 * k;
            t.mouthForm = 0.80 * k;
            t.cheek = 0.35 * k;
            t.expression3 = 0.5 * k;
            break;

          case 'enthusiastic':
          case 'excited':
            t.eyeOpenOffset = 0.25 * k;
            t.eyeHappy = 0.70 * k;
            t.mouthForm = 0.90 * k;
            t.browY = 0.50 * k;
            t.cheek = 0.45 * k;
            t.bodyLeanOffset = 0.4 * k;
            break;

          case 'relieved':
          case 'relief':
            t.mouthForm = 0.45 * k;
            t.eyeSmile = 0.50 * k;
            t.browY = 0.10;
            t.cheek = 0.25 * k;
            t.headPitchOffset = -2.0 * k;
            t.expression3 = 0.35 * k;
            break;

          case 'sleepy':
          case 'tired':
            t.eyeOpenOffset = -0.65 * k;
            t.browY = -0.20 * k;
            t.mouthForm = 0.10;
            t.headPitchOffset = -9.0 * k;
            t.headTiltOffset = -4.5 * k;
            t.cheek = 0.18;
            break;

          case 'neutral':
          default:
            // Standard pleasant baseline
            t.mouthForm = 0.25;
            t.cheek = 0.20;
            break;
        }

        this.target = t;
      }

      update(dt) {
        // Handle timed decay
        if (this.autoDecay && this.duration > 0.0) {
          this.elapsed += dt;
          if (this.elapsed >= this.duration) {
            this.setEmotion('neutral', 1.0, 0.0);
          }
        }

        // Smooth continuous interpolation (critically damped lerp)
        const speed = 7.0;
        const factor = Math.min(1.0, dt * speed);
        for (const k in this.target) {
          this.current[k] += (this.target[k] - this.current[k]) * factor;
        }
      }
    }

    // ══════════════════════════════════════════════════════════════════════════
    // 2. SISTEMA DE LUCIÉRNAGA MÁGICA Y FÍSICA FLOTANTE (EdithFireflySystem)
    // ══════════════════════════════════════════════════════════════════════════
    class EdithFireflySystem {
      constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas ? this.canvas.getContext('2d') : null;
        this.active = true;
        this.visible = true;

        // Normalized coordinates: [-1.0, 1.0] relative to avatar viewport
        this.nx = 0.38;
        this.ny = 0.22;
        this.targetNx = 0.38;
        this.targetNy = 0.22;

        this.x = 0;
        this.y = 0;
        this.flightTimer = 0.0;
        this.flightDuration = 3.2;
        this.t = Math.random() * 100.0;

        this.pulse = 0.0;
        this.wingsAngle = 0.0;
        this.trail = [];
        this.ripples = [];
        this.mousePos = { x: -9999, y: -9999 };
        this.frightTimer = 0.0;

        // Jibril-style Rotating Anime Light Halo state (Prop: Halo de Luz) - ELIMINADO
        this.halo = {
          alpha: 0.0,
          rot: 0.0,
          x: 350,
          y: 95,
          radius: 0,
          headX: 0.0,
          headY: 0.0,
          headZ: 0.0
        };
        this.haloMotes = [];

        this.resize();
        window.addEventListener('resize', () => this.resize());
      }

      setHaloState(st) {
        if (!st) return;
        this.halo.alpha = st.alpha !== undefined ? st.alpha : this.halo.alpha;
        this.halo.rot = st.rot !== undefined ? st.rot : this.halo.rot;
        this.halo.x = st.x !== undefined ? st.x : this.halo.x;
        this.halo.y = st.y !== undefined ? st.y : this.halo.y;
        this.halo.radius = st.radius !== undefined ? st.radius : this.halo.radius;
        this.halo.headX = st.headX !== undefined ? st.headX : 0.0;
        this.halo.headY = st.headY !== undefined ? st.headY : 0.0;
        this.halo.headZ = st.headZ !== undefined ? st.headZ : 0.0;
      }

      resize() {
        if (!this.canvas) return;
        this.width = window.innerWidth || 700;
        this.height = window.innerHeight || 800;
        this.canvas.width = this.width;
        this.canvas.height = this.height;
        this.updatePixelCoords();
      }

      updatePixelCoords() {
        this.x = (this.nx + 1.0) * 0.5 * (this.width || 700);
        this.y = (-this.ny + 1.0) * 0.5 * (this.height || 800);
      }

      onMouseMove(nx, ny) {
        this.mousePos.x = (nx + 1.0) * 0.5 * (this.width || 700);
        this.mousePos.y = (-ny + 1.0) * 0.5 * (this.height || 800);
      }

      pickNewTarget(state) {
        if (state === 'SLEEPING') {
          // Hover near shoulder as a peaceful sleeping nightlight
          this.targetNx = 0.40 + (Math.random() - 0.5) * 0.08;
          this.targetNy = -0.12 + (Math.random() - 0.5) * 0.06;
          this.flightDuration = 4.8 + Math.random() * 2.0;
          return;
        }

        const waypoints = [
          { nx: 0.46, ny: 0.32, dur: 3.4 },  // upper right
          { nx: -0.44, ny: 0.28, dur: 3.5 }, // upper left
          { nx: 0.18, ny: 0.52, dur: 3.0 },  // overhead flutter
          { nx: -0.15, ny: 0.46, dur: 3.0 }, // overhead left
          { nx: 0.34, ny: 0.06, dur: 3.6 },  // right shoulder hover
          { nx: -0.32, ny: -0.04, dur: 3.6 }, // left shoulder hover
          { nx: 0.02, ny: 0.20, dur: 2.8 },  // directly before her face
          { nx: 0.52, ny: -0.12, dur: 3.2 }, // near right hand
          { nx: -0.46, ny: -0.15, dur: 3.2 } // near left hand
        ];

        const next = waypoints[Math.floor(Math.random() * waypoints.length)];
        this.targetNx = next.nx + (Math.random() - 0.5) * 0.12;
        this.targetNy = next.ny + (Math.random() - 0.5) * 0.10;
        this.flightDuration = next.dur + (Math.random() - 0.5) * 1.0;
      }

      update(dt, state) {
        if (!this.active) return;
        this.t += dt;

        this.flightTimer += dt;
        if (this.flightTimer >= this.flightDuration) {
          this.flightTimer = 0.0;
          this.pickNewTarget(state);
        }

        // Fright escape if cursor approaches
        if (this.frightTimer > 0) {
          this.frightTimer -= dt;
        } else if (state !== 'SLEEPING') {
          const dx = this.x - this.mousePos.x;
          const dy = this.y - this.mousePos.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 95 && dist > 1) {
            this.frightTimer = 1.3;
            const pushX = (dx / dist) * 0.55;
            const pushY = -(dy / dist) * 0.45;
            this.targetNx = Math.max(-0.75, Math.min(0.75, this.nx + pushX));
            this.targetNy = Math.max(-0.40, Math.min(0.70, this.ny + pushY));
            this.flightTimer = 0.0;
            this.flightDuration = 1.6;
          }
        }

        const steerSpeed = (this.frightTimer > 0) ? 4.5 : (state === 'SLEEPING' ? 0.9 : 2.2);
        this.nx += (this.targetNx - this.nx) * Math.min(1.0, dt * steerSpeed);
        this.ny += (this.targetNy - this.ny) * Math.min(1.0, dt * steerSpeed);

        const hoverAmp = (state === 'SLEEPING') ? 0.015 : 0.038;
        const driftX = Math.sin(this.t * 2.8) * hoverAmp + Math.cos(this.t * 5.5) * (hoverAmp * 0.35);
        const driftY = Math.cos(this.t * 2.2) * hoverAmp + Math.sin(this.t * 4.8) * (hoverAmp * 0.35);

        const renderNx = this.nx + driftX;
        const renderNy = this.ny + driftY;

        this.x = (renderNx + 1.0) * 0.5 * (this.width || 700);
        this.y = (-renderNy + 1.0) * 0.5 * (this.height || 800);

        const pulseRate = (state === 'SLEEPING') ? 1.4 : 3.4;
        this.pulse = 0.5 + 0.5 * Math.sin(this.t * pulseRate);
        this.wingsAngle = Math.sin(this.t * 38.0) * 0.45;

        // Emit sparkling stardust trail
        if (state !== 'SLEEPING' && Math.random() < 0.48) {
          this.trail.push({
            x: this.x + (Math.random() - 0.5) * 6,
            y: this.y + (Math.random() - 0.5) * 6,
            radius: 1.5 + Math.random() * 2.2,
            alpha: 0.95,
            life: 0.0,
            maxLife: 0.65 + Math.random() * 0.4,
            vx: (Math.random() - 0.5) * 14,
            vy: 9 + Math.random() * 16
          });
        }

        for (let i = this.trail.length - 1; i >= 0; i--) {
          const p = this.trail[i];
          p.life += dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.alpha = Math.max(0, 1.0 - (p.life / p.maxLife));
          if (p.life >= p.maxLife) {
            this.trail.splice(i, 1);
          }
        }

        // Update interactive tactile ripples
        for (let i = this.ripples.length - 1; i >= 0; i--) {
          const r = this.ripples[i];
          r.radius += r.speed * dt;
          r.alpha = Math.max(0, 1.0 - (r.radius / r.maxRadius));
          if (r.radius >= r.maxRadius) {
            this.ripples.splice(i, 1);
          }
        }
      }

      spawnRipple(x, y, color = 'rgba(80, 220, 255, ALPHA)', maxRadius = 55, speed = 90) {
        this.ripples.push({
          x: x,
          y: y,
          radius: 4,
          maxRadius: maxRadius,
          speed: speed,
          alpha: 1.0,
          color: color,
          lineWidth: 2.5,
          shadowColor: 'rgba(0, 220, 255, 0.95)'
        });
        // Stardust burst at tactile point
        for (let i = 0; i < 7; i++) {
          const angle = Math.random() * Math.PI * 2;
          const spd = 20 + Math.random() * 45;
          this.trail.push({
            x: x,
            y: y,
            radius: 1.6 + Math.random() * 2.0,
            alpha: 1.0,
            life: 0.0,
            maxLife: 0.45 + Math.random() * 0.35,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd
          });
        }
      }

      renderJibrilHalo(ctx) {
        const h = this.halo;
        if (!h || h.alpha <= 0.005) return;

        const alpha = Math.max(0.0, Math.min(1.0, h.alpha));
        // Smooth ease-out scale on toggle
        const scaleAnim = 0.80 + 0.20 * Math.sin(alpha * Math.PI * 0.5);
        const R = h.radius * scaleAnim;
        const hx = h.x;
        const hy = h.y;

        // Perspectiva 3D de plano elíptico según cabeceo e inclinación de cabeza (centrado y horizontal por defecto)
        const tiltAngle = (h.headZ || 0.0) * 0.022;
        const perspY = Math.max(0.20, Math.min(0.36, 0.26 - (h.headY || 0.0) * 0.003));
        const spin = h.rot || 0.0;

        ctx.save();
        ctx.translate(hx, hy);
        ctx.rotate(tiltAngle);

        // MODO ADITIVO CELANDINO (Screen / Lighter) para resplandor anime cinematográfico
        ctx.globalCompositeOperation = 'lighter';

        // 1. Resplandor volumétrico etéreo (Soft Bloom Halo)
        ctx.save();
        ctx.scale(1.0, perspY);
        const bloomGrad = ctx.createRadialGradient(0, 0, R * 0.2, 0, 0, R * 1.55);
        bloomGrad.addColorStop(0.0, `rgba(255, 255, 255, ${0.45 * alpha})`);
        bloomGrad.addColorStop(0.35, `rgba(94, 234, 212, ${0.30 * alpha})`);
        bloomGrad.addColorStop(0.70, `rgba(192, 132, 252, ${0.22 * alpha})`);
        bloomGrad.addColorStop(1.0, `rgba(94, 234, 212, 0.0)`);

        ctx.beginPath();
        ctx.arc(0, 0, R * 1.55, 0, Math.PI * 2);
        ctx.fillStyle = bloomGrad;
        ctx.fill();
        ctx.restore();

        // 2. Destello anamórfico horizontal fino (Cinematic Anamorphic Light Streak)
        ctx.save();
        const streakW = R * 2.3;
        const streakH = Math.max(2.5, R * 0.045);
        const streakGrad = ctx.createLinearGradient(-streakW, 0, streakW, 0);
        streakGrad.addColorStop(0.0, 'rgba(168, 85, 247, 0.0)');
        streakGrad.addColorStop(0.3, `rgba(94, 234, 212, ${0.40 * alpha})`);
        streakGrad.addColorStop(0.5, `rgba(255, 255, 255, ${0.85 * alpha})`);
        streakGrad.addColorStop(0.7, `rgba(94, 234, 212, ${0.40 * alpha})`);
        streakGrad.addColorStop(1.0, 'rgba(168, 85, 247, 0.0)');

        ctx.beginPath();
        ctx.ellipse(0, 0, streakW, streakH, 0, 0, Math.PI * 2);
        ctx.fillStyle = streakGrad;
        ctx.fill();
        ctx.restore();

        // 3. Gradientes cromáticos iridiscentes de alta fidelidad
        const strokeGrad = ctx.createLinearGradient(-R * 1.2, -R * 0.3, R * 1.2, R * 0.3);
        strokeGrad.addColorStop(0.0, `rgba(216, 180, 254, ${0.95 * alpha})`);
        strokeGrad.addColorStop(0.35, `rgba(125, 211, 252, ${0.95 * alpha})`);
        strokeGrad.addColorStop(0.68, `rgba(94, 234, 212, ${0.98 * alpha})`);
        strokeGrad.addColorStop(1.0, `rgba(254, 240, 138, ${0.90 * alpha})`);

        // Dibujo de Geometría Celestial Pro
        const drawCelestialRings = (extraW, strokeStyle, shadowCol, shadowBlurVal) => {
          ctx.save();
          ctx.scale(1.0, perspY);
          ctx.rotate(spin);

          ctx.strokeStyle = strokeStyle;
          ctx.fillStyle = strokeStyle;
          ctx.lineJoin = 'round';
          ctx.lineCap = 'round';
          ctx.shadowColor = shadowCol;
          ctx.shadowBlur = shadowBlurVal;

          // A. Anillo exterior primario (Radiant Outer Crown)
          ctx.beginPath();
          ctx.arc(0, 0, R, 0, Math.PI * 2);
          ctx.lineWidth = 1.6 + extraW;
          ctx.stroke();

          // B. Anillo concéntrico rúnico segmentado (r = 0.78 * R) con aberturas místicas
          const rInner = R * 0.78;
          for (let s = 0; s < 6; s++) {
            const startA = s * (Math.PI / 3) + 0.10;
            const endA = (s + 1) * (Math.PI / 3) - 0.10;
            ctx.beginPath();
            ctx.arc(0, 0, rInner, startA, endA);
            ctx.lineWidth = 1.1 + extraW * 0.6;
            ctx.stroke();

            // Runic tick marks connecting inner and outer ring
            const midA = s * (Math.PI / 3) + (Math.PI / 6);
            ctx.beginPath();
            ctx.moveTo(Math.cos(midA) * rInner, Math.sin(midA) * rInner);
            ctx.lineTo(Math.cos(midA) * (R * 0.94), Math.sin(midA) * (R * 0.94));
            ctx.lineWidth = 1.0 + extraW * 0.5;
            ctx.stroke();
          }

          // C. Cuatro Rayos Cardinales Esbeltos (Tapered Celestial Needles)
          const primaryRays = [0, Math.PI * 0.5, Math.PI, Math.PI * 1.5];
          for (let i = 0; i < primaryRays.length; i++) {
            const a = primaryRays[i];
            const cos = Math.cos(a);
            const sin = Math.sin(a);
            const perpCos = -sin;
            const perpSin = cos;

            const rBase = R * 0.92;
            const rTip = R * 1.30 + extraW * 0.6;
            const halfW = 2.0 + extraW * 0.3;

            ctx.beginPath();
            ctx.moveTo(cos * rBase, sin * rBase);
            ctx.lineTo(cos * (rBase + (rTip - rBase) * 0.30) + perpCos * halfW, sin * (rBase + (rTip - rBase) * 0.30) + perpSin * halfW);
            ctx.lineTo(cos * rTip, sin * rTip);
            ctx.lineTo(cos * (rBase + (rTip - rBase) * 0.30) - perpCos * halfW, sin * (rBase + (rTip - rBase) * 0.30) - perpSin * halfW);
            ctx.closePath();
            ctx.fill();
            if (extraW > 0) ctx.stroke();
          }

          // D. Micro Cristales a 45 grados (Secondary Diamond Flares)
          const secondaryRays = [Math.PI * 0.25, Math.PI * 0.75, Math.PI * 1.25, Math.PI * 1.75];
          for (let i = 0; i < secondaryRays.length; i++) {
            const a = secondaryRays[i];
            const cos = Math.cos(a);
            const sin = Math.sin(a);
            const rTip = R * 1.14 + extraW * 0.4;
            const rBase = R * 0.96;

            ctx.beginPath();
            ctx.moveTo(cos * rBase, sin * rBase);
            ctx.lineTo(cos * rTip, sin * rTip);
            ctx.lineWidth = 1.1 + extraW * 0.5;
            ctx.stroke();

            // Pips de luz estelar
            ctx.beginPath();
            ctx.arc(cos * (rTip + 2.0), sin * (rTip + 2.0), 1.2 + extraW * 0.25, 0, Math.PI * 2);
            ctx.fill();
          }

          // E. Astrolabio Central en Contrarrotación (r = 0.45 * R)
          ctx.save();
          ctx.rotate(-spin * 2.2);
          const rCore = R * 0.45;
          ctx.beginPath();
          ctx.arc(0, 0, rCore, 0, Math.PI * 2);
          ctx.lineWidth = 1.0 + extraW * 0.4;
          ctx.stroke();

          // Estrella polar central de 8 puntas
          const starR = R * 0.20 + extraW * 0.3;
          const starInner = starR * 0.32;
          ctx.beginPath();
          for (let pt = 0; pt < 8; pt++) {
            const starAngle = pt * (Math.PI * 0.25);
            const curRad = (pt % 2 === 0) ? starR : starInner;
            const px = Math.cos(starAngle) * curRad;
            const py = Math.sin(starAngle) * curRad;
            if (pt === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fill();
          ctx.restore();

          // F. Blasón Winged Flügel / Corona Celestial Superior
          const crestAngle = -Math.PI * 0.5;
          const crestX = Math.cos(crestAngle) * R;
          const crestY = Math.sin(crestAngle) * R;
          ctx.save();
          ctx.translate(crestX, crestY);
          ctx.rotate(crestAngle + Math.PI * 0.5);

          const cw = 12 + extraW * 1.2;
          const ch = 8 + extraW * 0.8;
          ctx.beginPath();
          ctx.moveTo(-cw, -ch * 0.4);
          ctx.quadraticCurveTo(-cw * 0.5, -ch * 1.1, 0, -ch * 0.2);
          ctx.quadraticCurveTo(cw * 0.5, -ch * 1.1, cw, -ch * 0.4);
          ctx.quadraticCurveTo(0, ch * 0.8, -cw, -ch * 0.4);
          ctx.closePath();
          ctx.fill();

          ctx.beginPath();
          ctx.arc(0, -ch * 0.65, 2.2 + extraW * 0.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          ctx.restore();
        };

        // Renderizado multicapa con resplandor aditivo:
        // Capa 1: Aura etérea de difusión lavanda/menta
        drawCelestialRings(2.2, strokeGrad, `rgba(168, 85, 247, ${0.80 * alpha})`, 16 * alpha);
        // Capa 2: Núcleo esmeralda/turquesa vívido
        drawCelestialRings(0.8, `rgba(94, 234, 212, ${0.95 * alpha})`, `rgba(94, 234, 212, ${0.90 * alpha})`, 8 * alpha);
        // Capa 3: Rayo de luz blanca pura central (#FFFFFF)
        drawCelestialRings(0.0, `rgba(255, 255, 255, ${0.98 * alpha})`, `rgba(255, 255, 255, ${0.95 * alpha})`, 4 * alpha);

        // 4. Motas de Polvo Estelar Ascendentes (Orbital Stardust Motes)
        for (let i = 0; i < this.haloMotes.length; i++) {
          const m = this.haloMotes[i];
          const curA = m.angle + spin * 0.85;
          const wave = Math.sin(this.t * m.speed * 2.2 + m.phase);
          const mx = Math.cos(curA) * R * m.dist;
          const my = Math.sin(curA) * R * m.dist * perspY - (wave + 1.0) * 8.0;
          const mAlpha = alpha * (0.45 + 0.55 * (0.5 + 0.5 * wave));
          const isLeft = mx < 0;
          const moteColor = isLeft
            ? `rgba(216, 180, 254, ${mAlpha.toFixed(3)})`
            : `rgba(94, 234, 212, ${mAlpha.toFixed(3)})`;

          ctx.beginPath();
          ctx.arc(mx, my, (m.size || 1.6) * scaleAnim, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = moteColor;
          ctx.shadowBlur = 8 * alpha;
          ctx.fill();
        }

        ctx.restore();
      }

      render(state) {
        if (!this.ctx || !this.active) return;
        const ctx = this.ctx;
        ctx.clearRect(0, 0, this.width, this.height);

        // Jibril-style Rotating Anime Light Halo (Prop: Halo de Luz) - Desactivado
        if (false && this.halo && this.halo.alpha > 0.005) {
          this.renderJibrilHalo(ctx);
        }

        if (!this.visible) return;

        // Tactile interactive ripples
        for (let i = 0; i < this.ripples.length; i++) {
          const r = this.ripples[i];
          ctx.save();
          ctx.beginPath();
          ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
          ctx.strokeStyle = r.color.replace('ALPHA', String(r.alpha.toFixed(3)));
          ctx.lineWidth = r.lineWidth * (1 - (r.radius / r.maxRadius) * 0.5);
          ctx.shadowColor = r.shadowColor || 'rgba(0, 240, 255, 0.9)';
          ctx.shadowBlur = 10 * r.alpha;
          ctx.stroke();

          if (r.radius > 8) {
            ctx.beginPath();
            ctx.arc(r.x, r.y, r.radius * 0.58, 0, Math.PI * 2);
            ctx.strokeStyle = r.color.replace('ALPHA', String((r.alpha * 0.55).toFixed(3)));
            ctx.lineWidth = 1.4;
            ctx.stroke();
          }
          ctx.restore();
        }

        // Stardust particle trail
        for (let i = 0; i < this.trail.length; i++) {
          const p = this.trail[i];
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 235, 140, ${p.alpha * 0.8})`;
          ctx.shadowColor = 'rgba(255, 215, 0, 0.85)';
          ctx.shadowBlur = 6;
          ctx.fill();
        }

        const isSleep = (state === 'SLEEPING');
        const glowMult = isSleep ? 0.45 : (0.75 + this.pulse * 0.35);

        // Bioluminescent warm aura
        const outerRadius = (isSleep ? 16 : 30) * glowMult;
        const grad = ctx.createRadialGradient(this.x, this.y, 1, this.x, this.y, outerRadius);
        grad.addColorStop(0.0, `rgba(255, 255, 230, ${0.98 * glowMult})`);
        grad.addColorStop(0.25, `rgba(255, 220, 90, ${0.72 * glowMult})`);
        grad.addColorStop(0.60, `rgba(120, 240, 200, ${0.32 * glowMult})`);
        grad.addColorStop(1.0, 'rgba(60, 200, 180, 0.0)');

        ctx.beginPath();
        ctx.arc(this.x, this.y, outerRadius, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.shadowColor = 'rgba(255, 230, 120, 0.95)';
        ctx.shadowBlur = 20 * glowMult;
        ctx.fill();

        // Fluttering gossamer wings
        if (!isSleep) {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.shadowBlur = 0;

          // Left Wing
          ctx.save();
          ctx.rotate(-0.35 + this.wingsAngle);
          ctx.beginPath();
          ctx.ellipse(-4, -6, 2.5, 6.5, -0.4, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(240, 255, 250, 0.70)';
          ctx.fill();
          ctx.restore();

          // Right Wing
          ctx.save();
          ctx.rotate(0.35 - this.wingsAngle);
          ctx.beginPath();
          ctx.ellipse(4, -6, 2.5, 6.5, 0.4, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(240, 255, 250, 0.70)';
          ctx.fill();
          ctx.restore();

          ctx.restore();
        }

        // Luminous Core
        const coreRadius = isSleep ? 2.5 : (3.6 + this.pulse * 1.3);
        ctx.beginPath();
        ctx.arc(this.x, this.y, coreRadius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#ffeaa7';
        ctx.shadowBlur = 12;
        ctx.fill();
      }
    }

    // ══════════════════════════════════════════════════════════════════════════
    // 2.5 SISTEMA DE MIRADA Y AUTONOMÍA OCULAR (EdithGazeController)
    // ══════════════════════════════════════════════════════════════════════════
    class EdithGazeController {
      constructor() {
        // Gaze mode: 'USER', 'FIREFLY', 'ENVIRONMENT', 'DISTRACTED', 'DOWN', 'CURSOR'
        this.mode = 'USER';
        this.modeTimer = 0.0;
        this.modeDuration = 4.0;
        this.firefly = null;

        // Coordinates
        this.targetGaze = { x: 0.0, y: 0.0 };
        this.currentGaze = { x: 0.0, y: 0.0 };
        this.headTarget = { x: 0.0, y: 0.0, z: 0.0 };
        this.headCurrent = { x: 0.0, y: 0.0, z: 0.0 };

        // Mouse tracking & interest management
        this.mousePos = { x: 0.0, y: 0.0 };
        this.lastMousePos = { x: 0.0, y: 0.0 };
        this.hasMouse = false;
        this.mouseSpeed = 0.0;
        this.cursorCooldown = 0.0;
        this.cursorCuriositySpan = 0.0;

        // Micro-saccades (biological ocular trembling & scanning)
        this.saccadeTimer = 0.0;
        this.saccadeNext = 1.2;
        this.saccadeOffset = { x: 0.0, y: 0.0 };

        // Global curiosity / autonomy level
        this.autonomyEnabled = true;
        this.spontaneityLevel = 1.0;
      }

      onMouseMove(nx, ny) {
        this.hasMouse = true;
        const dx = nx - this.lastMousePos.x;
        const dy = ny - this.lastMousePos.y;
        this.mouseSpeed = Math.sqrt(dx * dx + dy * dy);
        this.lastMousePos.x = nx;
        this.lastMousePos.y = ny;
        this.mousePos.x = nx;
        this.mousePos.y = ny;

        if (this.firefly) {
          this.firefly.onMouseMove(nx, ny);
        }

        // Contextual curiosity evaluation:
        if (this.autonomyEnabled && this.cursorCooldown <= 0.0 && this.mouseSpeed > 0.025) {
          const chance = 0.50 * this.spontaneityLevel;
          if (Math.random() < chance && this.mode !== 'CURSOR') {
            this.mode = 'CURSOR';
            this.modeTimer = 0.0;
            this.modeDuration = 1.8 + Math.random() * 1.6;
          }
        }
      }

      onMouseLeave() {
        this.hasMouse = false;
      }

      glance(dx, dy, hold = 1.5) {
        this.mode = 'DIRECTED';
        this.targetGaze.x = Math.max(-1.0, Math.min(1.0, dx));
        this.targetGaze.y = Math.max(-1.0, Math.min(1.0, dy));
        this.modeTimer = 0.0;
        this.modeDuration = Math.max(0.8, hold);
      }

      update(dt, state, isSleep) {
        if (isSleep) {
          this.currentGaze.x += (0.0 - this.currentGaze.x) * Math.min(1.0, dt * 2.0);
          this.currentGaze.y += (-0.4 - this.currentGaze.y) * Math.min(1.0, dt * 2.0);
          return;
        }

        if (this.cursorCooldown > 0.0) {
          this.cursorCooldown -= dt;
        }

        // Biological Micro-Saccades
        this.saccadeTimer += dt;
        if (this.saccadeTimer >= this.saccadeNext) {
          this.saccadeTimer = 0.0;
          this.saccadeNext = 0.8 + Math.random() * 1.6;
          this.saccadeOffset.x = (Math.random() - 0.5) * 0.09;
          this.saccadeOffset.y = (Math.random() - 0.5) * 0.06;
        }

        // State Machine for Autonomous Gaze
        this.modeTimer += dt;
        if (this.modeTimer >= this.modeDuration) {
          this.modeTimer = 0.0;
          this.selectNextGazeMode(state);
        }

        // Calculate Target Gaze according to active mode
        let gx = 0.0;
        let gy = 0.0;

        switch (this.mode) {
          case 'FIREFLY':
            if (this.firefly && this.firefly.active) {
              gx = Math.max(-1.0, Math.min(1.0, this.firefly.nx * 1.15));
              gy = Math.max(-1.0, Math.min(1.0, this.firefly.ny * 1.05));
            } else {
              gx = this.targetGaze.x;
              gy = this.targetGaze.y;
            }
            break;

          case 'CURSOR':
            gx = this.mousePos.x * 0.88;
            gy = this.mousePos.y * 0.78;
            break;

          case 'USER':
            // Direct eye contact with subtle ambient drift
            gx = (Math.random() - 0.5) * 0.08;
            gy = (Math.random() - 0.5) * 0.06;
            break;

          case 'ENVIRONMENT':
            gx = this.targetGaze.x;
            gy = this.targetGaze.y;
            break;

          case 'DISTRACTED':
            gx = this.targetGaze.x;
            gy = this.targetGaze.y;
            break;

          case 'DOWN':
            gx = (Math.random() - 0.5) * 0.15;
            gy = -0.55;
            break;

          case 'DIRECTED':
          default:
            gx = this.targetGaze.x;
            gy = this.targetGaze.y;
            break;
        }

        // Add micro-saccades
        gx += this.saccadeOffset.x;
        gy += this.saccadeOffset.y;

        // Smooth eye follow with natural speed (faster for firefly / cursor tracking)
        const eyeSpeed = (this.mode === 'CURSOR') ? 10.0 : (this.mode === 'FIREFLY' ? 8.5 : 5.5);
        this.currentGaze.x += (gx - this.currentGaze.x) * Math.min(1.0, dt * eyeSpeed);
        this.currentGaze.y += (gy - this.currentGaze.y) * Math.min(1.0, dt * eyeSpeed);

        // Head target follows eye target with biomechanical realism
        let htx = this.currentGaze.x * 24.0;
        let hty = this.currentGaze.y * 17.0;
        let htz = this.currentGaze.x * -7.5;

        if (state === 'LISTENING') {
          // Attentive forward tilt
          hty += 2.0;
          htz += 4.5;
        } else if (state === 'THINKING') {
          // Pensive upward & lateral tilt
          hty += 6.5;
          htz -= 8.0;
        }

        const headSpeed = (this.mode === 'FIREFLY') ? 5.8 : 4.8;
        this.headCurrent.x += (htx - this.headCurrent.x) * Math.min(1.0, dt * headSpeed);
        this.headCurrent.y += (hty - this.headCurrent.y) * Math.min(1.0, dt * headSpeed);
        this.headCurrent.z += (htz - this.headCurrent.z) * Math.min(1.0, dt * headSpeed);
      }

      selectNextGazeMode(state) {
        if (!this.autonomyEnabled) {
          this.mode = 'USER';
          this.modeDuration = 5.0;
          return;
        }

        if (this.mode === 'CURSOR') {
          this.cursorCooldown = 4.5 + Math.random() * 5.0;
        }

        if (state === 'LISTENING') {
          // Highly focused on the user with rare glances to firefly/environment
          const roll = Math.random();
          if (roll < 0.75) {
            this.mode = 'USER';
            this.modeDuration = 3.5 + Math.random() * 2.5;
          } else if (this.firefly && roll < 0.90) {
            this.mode = 'FIREFLY';
            this.modeDuration = 1.6 + Math.random() * 1.2;
          } else {
            this.mode = 'ENVIRONMENT';
            this.targetGaze.x = (Math.random() - 0.5) * 0.4;
            this.targetGaze.y = (Math.random() - 0.5) * 0.25;
            this.modeDuration = 1.4 + Math.random() * 1.2;
          }
        } else if (state === 'SPEAKING') {
          // Engaging with user, occasional glance aside while phrasing
          const roll = Math.random();
          if (roll < 0.65) {
            this.mode = 'USER';
            this.modeDuration = 2.8 + Math.random() * 2.2;
          } else if (this.firefly && roll < 0.85) {
            this.mode = 'FIREFLY';
            this.modeDuration = 1.5 + Math.random() * 1.5;
          } else {
            this.mode = 'DISTRACTED';
            this.targetGaze.x = (Math.random() > 0.5 ? 0.45 : -0.45) + (Math.random() - 0.5) * 0.2;
            this.targetGaze.y = (Math.random() - 0.5) * 0.3;
            this.modeDuration = 1.2 + Math.random() * 1.5;
          }
        } else {
          // IDLE: full autonomy with active Firefly fascination!
          const roll = Math.random();
          if (this.firefly && this.firefly.active && roll < 0.60) {
            this.mode = 'FIREFLY';
            this.modeDuration = 3.8 + Math.random() * 4.6;
          } else if (roll < 0.82) {
            this.mode = 'USER';
            this.modeDuration = 2.8 + Math.random() * 3.2;
          } else if (roll < 0.94) {
            this.mode = 'ENVIRONMENT';
            const angles = [
              { x: -0.65, y: 0.30 },
              { x: 0.60, y: 0.25 },
              { x: -0.50, y: -0.30 },
              { x: 0.55, y: -0.25 },
              { x: 0.0, y: 0.45 }
            ];
            const pick = angles[Math.floor(Math.random() * angles.length)];
            this.targetGaze.x = pick.x;
            this.targetGaze.y = pick.y;
            this.modeDuration = 2.2 + Math.random() * 3.0;
          } else {
            this.mode = 'DISTRACTED';
            this.targetGaze.x = (Math.random() > 0.5 ? 0.70 : -0.70);
            this.targetGaze.y = -0.15 + (Math.random() - 0.5) * 0.3;
            this.modeDuration = 2.5 + Math.random() * 3.2;
          }
        }
      }
    }

    // ══════════════════════════════════════════════════════════════════════════
    // 3. MOTOR DE ACCIONES ESPONTÁNEAS (EdithSpontaneousEngine)
    // ══════════════════════════════════════════════════════════════════════════
    class EdithSpontaneousEngine {
      constructor(app) {
        this.app = app;
        this.autonomyEnabled = true;
        this.spontaneityLevel = 1.0;
        this.mood = 'cheerful'; // 'cheerful', 'calm', 'playful', 'thoughtful', 'tired'

        // Idle time counter & scheduling
        this.idleTime = 0.0;
        this.timeSinceLastAction = 0.0;
        this.nextActionDelay = 12.0;

        // Active Action State
        this.activeAction = null;
        this.actionElapsed = 0.0;
        this.actionDuration = 0.0;
        this.actionBlendIn = 0.4;
        this.actionBlendOut = 0.5;

        // Anti-repetition buffer
        this.actionHistory = [];

        // Procedural animation outputs
        this.offsets = {
          angleX: 0.0,
          angleY: 0.0,
          angleZ: 0.0,
          bodyX: 0.0,
          bodyY: 0.0,
          bodyZ: 0.0,
          posZ: 0.0,
          posX: 0.0,
          posY: 0.0,
          shoulderL: 0.0,
          shoulderR: 0.0,
          armL: 0.0,
          armR: 0.0,
          armBL: 0.0,
          armBR: 0.0,
          sleeveL: 0.0,
          sleeveR: 0.0,
          sleeveLL: 0.0,
          sleeveLR: 0.0,
          chestZ: 0.0,
          hipZ: 0.0,
          breathBonus: 0.0,
          mouthOpenBonus: 0.0,
          mouthFormBonus: 0.0,
          cheekBonus: 0.0,
          cheekPuffBonus: 0.0,
          tongueBonus: 0.0,
          eyeSmileBonus: 0.0,
          eyeOpenBonus: 0.0,
          exp3Bonus: 0.0
        };
      }

      resetOffsets() {
        for (const k in this.offsets) {
          this.offsets[k] = 0.0;
        }
      }

      triggerAction(name, force = true) {
        name = String(name || '').toUpperCase().trim();

        // Redirigir animaciones GESTURE_* al sistema de gestos del avatar
        if (name.startsWith('GESTURE_')) {
          const gestureKey = name.slice(8); // quitar prefijo GESTURE_
          if (this.app && this.app.gestures) {
            const lib = this.app.gestures.definitions;
            if (lib && lib[gestureKey]) {
              this.app.gestures.triggerGesture(gestureKey, lib[gestureKey].duration, lib[gestureKey].params && lib[gestureKey].params.emotionIntensity || 1.0);
              return true;
            }
          }
          console.warn("[Spontaneous] Gesto redirigido no encontrado:", gestureKey);
          return false;
        }

        const defs = this.getActionDefinitions();
        if (!defs[name]) {
          console.warn("[Spontaneous] Accion desconocida:", name);
          return false;
        }

        if (this.activeAction && !force) return false;

        this.activeAction = name;
        this.actionElapsed = 0.0;
        this.actionDuration = defs[name].duration;
        this.actionBlendIn = defs[name].blendIn || 0.45;
        this.actionBlendOut = defs[name].blendOut || 0.55;

        // Record history
        this.actionHistory.push(name);
        if (this.actionHistory.length > 4) this.actionHistory.shift();

        this.timeSinceLastAction = 0.0;
        this.scheduleNextAction();
        return true;
      }

      scheduleNextAction() {
        // Base delay modulated by spontaneity level (7s - 22s)
        const base = 10.0 + Math.random() * 12.0;
        const scale = Math.max(0.3, 1.8 - (this.spontaneityLevel * 0.8));
        this.nextActionDelay = base * scale;
      }

      update(dt, state, isSleep) {
        if (isSleep || !this.autonomyEnabled) {
          this.resetOffsets();
          this.activeAction = null;
          return;
        }

        // Track inactivity
        if (state === 'IDLE') {
          this.idleTime += dt;
          this.timeSinceLastAction += dt;
        } else {
          this.idleTime = 0.0;
          // While speaking or listening, gentle interrupt of high-movement actions
          if (this.activeAction === 'BOB_DANCE' || this.activeAction === 'STRETCH') {
            this.interruptAction();
          }
        }

        // Autonomous Action Decision
        if (!this.activeAction && state === 'IDLE' && this.timeSinceLastAction >= this.nextActionDelay) {
          this.decideAndExecuteAction();
        }

        // Animate active action
        if (this.activeAction) {
          this.actionElapsed += dt;
          if (this.actionElapsed >= this.actionDuration) {
            this.activeAction = null;
            this.resetOffsets();
            this.scheduleNextAction();
          } else {
            this.computeActionCurves();
          }
        }
      }

      interruptAction() {
        if (this.activeAction) {
          // Skip to blend out phase
          this.actionElapsed = Math.max(this.actionElapsed, this.actionDuration - this.actionBlendOut);
        }
      }

      decideAndExecuteAction() {
        const pool = this.getActionPool();
        if (pool.length === 0) return;

        // Weighted random selection with anti-repetition filter
        const candidates = [];
        for (const item of pool) {
          let weight = item.weight;
          // Heavily penalize recently executed actions
          if (this.actionHistory.includes(item.name)) {
            const recency = this.actionHistory.lastIndexOf(item.name);
            weight *= (recency === this.actionHistory.length - 1) ? 0.05 : 0.35;
          }
          candidates.push({ name: item.name, weight: Math.max(0.01, weight) });
        }

        const totalWeight = candidates.reduce((s, c) => s + c.weight, 0);
        let rnd = Math.random() * totalWeight;
        let selected = candidates[0].name;

        for (const c of candidates) {
          if (rnd <= c.weight) {
            selected = c.name;
            break;
          }
          rnd -= c.weight;
        }

        this.triggerAction(selected, false);
      }

        if (this.mood === 'cheerful') {

      computeActionCurves() {
        const t = this.actionElapsed;
        const dur = this.actionDuration;

        // Calculate smooth Hermite/Sine envelope alpha (0.0 -> 1.0 -> 0.0)
        let alpha = 1.0;
        if (t < this.actionBlendIn) {
          const s = t / this.actionBlendIn;
          alpha = Math.sin(s * Math.PI * 0.5);
        } else if (t > dur - this.actionBlendOut) {
          const s = (dur - t) / this.actionBlendOut;
          alpha = Math.sin(Math.max(0.0, s) * Math.PI * 0.5);
        }

        this.resetOffsets();

        switch (this.activeAction) {
          case 'ELEGANT_BOW': {
            // Distinguished, respectful executive bow with graceful hand to chest
            const phase = Math.sin((t / dur) * Math.PI);
            this.offsets.angleY = -phase * 16.0 * alpha;
            this.offsets.posY = -phase * 14.0 * alpha;
            this.offsets.posZ = -phase * 0.45 * alpha;
            this.offsets.shoulderL = -phase * 0.40 * alpha;
            this.offsets.armL = phase * 0.55 * alpha;
            this.offsets.sleeveL = phase * 0.45 * alpha;
            this.offsets.shoulderR = -phase * 0.25 * alpha;
            this.offsets.armR = -phase * 0.20 * alpha;
            this.offsets.eyeSmileBonus = phase * 0.85 * alpha;
            this.offsets.eyeOpenBonus = -phase * 0.35 * alpha;
            this.offsets.mouthFormBonus = phase * 0.75 * alpha;
            this.offsets.cheekBonus = phase * 0.30 * alpha;
            break;
          }

          case 'THINKING_DEEP': {
            // Deep reflective analytical stance: hand near chin, upward gaze, contemplative tilt
            const s = Math.sin((t / dur) * Math.PI);
            this.offsets.shoulderR = s * 0.55 * alpha;
            this.offsets.armR = -s * 0.75 * alpha;
            this.offsets.sleeveR = s * 0.60 * alpha;
            this.offsets.sleeveLR = s * 0.45 * alpha;
            this.offsets.angleZ = s * 9.0 * alpha;
            this.offsets.angleY = s * 8.0 * alpha;
            this.offsets.angleX = s * 6.0 * alpha;
            this.offsets.eyeSmileBonus = -s * 0.15 * alpha;
            this.offsets.mouthFormBonus = s * 0.30 * alpha;
            this.offsets.chestZ = s * 0.25 * alpha;
            break;
          }

          case 'AGREE_WARM_NOD': {
            // Warm rhythmic double nod of respectful approval and understanding
            const nod = Math.sin(t * 5.5) * Math.sin((t / dur) * Math.PI);
            this.offsets.angleY = (nod * 12.0 - 2.0) * alpha;
            this.offsets.posY = (nod * 6.0) * alpha;
            this.offsets.shoulderL = -nod * 0.20 * alpha;
            this.offsets.shoulderR = -nod * 0.20 * alpha;
            this.offsets.eyeSmileBonus = 0.95 * alpha;
            this.offsets.mouthFormBonus = 0.90 * alpha;
            this.offsets.cheekBonus = 0.40 * alpha;
            break;
          }

          case 'EXPLAIN_POINT': {
            // Eloquent didactic explanation with left arm/sleeve gesturing smoothly
            const g = Math.sin(t * 3.8);
            const env = Math.sin((t / dur) * Math.PI);
            this.offsets.shoulderL = env * 0.50 * alpha;
            this.offsets.armL = (env * 0.45 + g * 0.20) * alpha;
            this.offsets.sleeveL = (env * 0.55 + g * 0.25) * alpha;
            this.offsets.angleX = (g * 7.0) * alpha;
            this.offsets.angleY = (env * 5.0) * alpha;
            this.offsets.bodyX = (g * 4.0) * alpha;
            this.offsets.chestZ = (-g * 0.30) * alpha;
            this.offsets.mouthFormBonus = 0.70 * alpha;
            this.offsets.eyeSmileBonus = 0.60 * alpha;
            break;
          }

          case 'ATTENTIVE_LEAN': {
            // Attentive forward lean of professional active listening and keen interest
            const s = Math.sin((t / dur) * Math.PI);
            this.offsets.posZ = s * 0.65 * alpha;
            this.offsets.posY = s * 8.0 * alpha;
            this.offsets.angleY = s * 7.0 * alpha;
            this.offsets.angleZ = s * 6.0 * alpha;
            this.offsets.shoulderL = s * 0.25 * alpha;
            this.offsets.shoulderR = s * 0.25 * alpha;
            this.offsets.eyeOpenBonus = s * 0.35 * alpha;
            this.offsets.eyeSmileBonus = s * 0.50 * alpha;
            this.offsets.mouthFormBonus = s * 0.70 * alpha;
            break;

          case 'CALM_BREATHE': {

            this.offsets.chestZ = s * 0.45 * alpha;

            this.offsets.sleeveR = s * 0.75 * alpha;

          }

          case 'CONFIDENT_CROSS': {

            this.offsets.shoulderL = s * 0.40 * alpha;

            this.offsets.armL = -s * 0.50 * alpha;
            this.offsets.armR = -s * 0.50 * alpha;
            this.offsets.sleeveL = s * 0.40 * alpha;

          case 'ENCOURAGE_CLAP': {
            // Elegant, graceful applause with hands centered at chest
            const clap = Math.abs(Math.sin(t * 10.0));
            const env = Math.sin((t / dur) * Math.PI);
            this.offsets.shoulderL = (0.35 + clap * 0.15) * alpha * env;
            this.offsets.shoulderR = (0.35 + clap * 0.15) * alpha * env;
            this.offsets.armL = (-0.55 - clap * 0.15) * alpha * env;
            this.offsets.armR = (-0.55 - clap * 0.15) * alpha * env;
            this.offsets.sleeveL = (0.45 + clap * 0.15) * alpha * env;
            this.offsets.sleeveR = (0.45 + clap * 0.15) * alpha * env;
            this.offsets.posY = (clap * 4.0) * alpha * env;
            this.offsets.eyeSmileBonus = 0.95 * alpha;
            this.offsets.mouthFormBonus = 0.90 * alpha;
            this.offsets.cheekBonus = 0.40 * alpha;
            break;
          }


          case 'BOB_DANCE': {
            // Rhythmic joyful dance with arms swinging, hips and chest counter-swaying, head bobbing
            const beat = Math.sin(t * 5.4);
            const bounce = Math.abs(Math.sin(t * 5.4));
            this.offsets.bodyZ = beat * 9.5 * alpha;
            this.offsets.bodyX = beat * 6.0 * alpha;
            this.offsets.angleZ = -beat * 12.0 * alpha;
            this.offsets.angleY = (bounce * 8.0 - 4.0) * alpha;
            this.offsets.posY = bounce * 32.0 * alpha;
            this.offsets.posX = beat * 16.0 * alpha;
            // Coordinated arm and sleeve dance motions
            this.offsets.shoulderL = beat * 0.45 * alpha;
            this.offsets.shoulderR = -beat * 0.45 * alpha;
            this.offsets.armL = beat * 0.40 * alpha;
            this.offsets.armR = -beat * 0.40 * alpha;
            this.offsets.sleeveL = beat * 0.45 * alpha;
            this.offsets.sleeveR = -beat * 0.45 * alpha;
            this.offsets.hipZ = beat * 0.70 * alpha;
            this.offsets.chestZ = -beat * 0.55 * alpha;
            this.offsets.mouthFormBonus = 0.85 * alpha;
            this.offsets.eyeSmileBonus = 0.75 * alpha;
            this.offsets.cheekBonus = 0.35 * alpha;

          case 'GREETING_WAVE': {
            // Right arm raises high and waves enthusiastically at the user, friendly tilt and smile
            const wave = Math.sin(t * 11.0);
            this.offsets.shoulderR = 0.85 * alpha;

            this.offsets.armBR = 0.50 * alpha;

            this.offsets.chestZ = 0.35 * alpha;
            this.offsets.bodyZ = 3.5 * alpha;
            this.offsets.angleZ = 7.5 * alpha;

            this.offsets.mouthFormBonus = 0.85 * alpha;
            this.offsets.cheekBonus = 0.45 * alpha;

          case 'STRETCH': {
            // Full relaxing stretch: both arms reach back/up, chest expands, head arches back, deep breath
            const phase = t / dur;
            const stretchCurve = Math.sin(phase * Math.PI);
            this.offsets.angleY = stretchCurve * 18.0 * alpha;
            this.offsets.angleZ = Math.sin(phase * Math.PI * 2) * 6.0 * alpha;
            this.offsets.posZ = stretchCurve * 0.65 * alpha;
            this.offsets.breathBonus = stretchCurve * 1.0 * alpha;

            this.offsets.mouthFormBonus = stretchCurve * 0.45 * alpha;
            this.offsets.mouthOpenBonus = stretchCurve * 0.40 * alpha;
            this.offsets.shoulderL = stretchCurve * 0.65 * alpha;
            this.offsets.shoulderR = stretchCurve * 0.65 * alpha;
            this.offsets.armL = stretchCurve * 0.50 * alpha;
            this.offsets.armR = stretchCurve * 0.50 * alpha;
            this.offsets.sleeveL = stretchCurve * 0.60 * alpha;
            this.offsets.sleeveR = stretchCurve * 0.60 * alpha;
            this.offsets.chestZ = stretchCurve * 0.45 * alpha;
            break;
          }

          case 'YAWN': {
            // Sleepy stretch with left hand raised toward mouth, head tilts up, wide jaw opening
            const phase = t / dur;
            const openCurve = Math.sin(phase * Math.PI);
            this.offsets.angleY = openCurve * 14.0 * alpha;
            this.offsets.angleZ = -openCurve * 6.0 * alpha;
            this.offsets.mouthOpenBonus = Math.pow(openCurve, 1.4) * 1.45 * alpha;
            this.offsets.eyeOpenBonus = -openCurve * 0.85 * alpha;
            this.offsets.breathBonus = openCurve * 0.90 * alpha;
            this.offsets.shoulderL = openCurve * 0.60 * alpha;
            this.offsets.armL = openCurve * 0.55 * alpha;
            this.offsets.sleeveL = openCurve * 0.60 * alpha;
            this.offsets.cheekBonus = openCurve * 0.45 * alpha;
            break;
          }

          case 'HEAD_TILT_CURIOUS': {
            // Expressive curious lean: deep head tilt, perked shoulder, wide sparkling eyes
            const tilt = Math.sin((t / dur) * Math.PI);
            this.offsets.angleZ = -tilt * 22.0 * alpha;
            this.offsets.angleX = tilt * 6.0 * alpha;
            this.offsets.angleY = -tilt * 4.0 * alpha;
            this.offsets.posZ = tilt * 0.45 * alpha;
            this.offsets.shoulderR = tilt * 0.40 * alpha;
            this.offsets.shoulderL = -tilt * 0.20 * alpha;
            this.offsets.armR = tilt * 0.25 * alpha;
            this.offsets.sleeveR = tilt * 0.30 * alpha;
            this.offsets.chestZ = -tilt * 0.35 * alpha;
            this.offsets.eyeOpenBonus = tilt * 0.40 * alpha;
            this.offsets.mouthFormBonus = tilt * 0.35 * alpha;
            break;

            const p = t / dur;
            const yaw = Math.sin(p * Math.PI * 2.0);
            this.offsets.angleX = yaw * 24.0 * alpha;
            this.offsets.bodyX = yaw * 10.0 * alpha;
            this.offsets.bodyZ = yaw * 5.0 * alpha;
            this.offsets.angleY = Math.cos(p * Math.PI * 2.0) * 9.0 * alpha;
            this.offsets.eyeOpenBonus = 0.20 * alpha;
            this.offsets.shoulderL = yaw * 0.20 * alpha;
            this.offsets.shoulderR = -yaw * 0.20 * alpha;
            this.offsets.chestZ = yaw * 0.35 * alpha;
            break;
          }

          case 'PLAYFUL_TONGUE': {
            // Adorable wink, cheeky shoulder shrug, tongue poke, blush
            const p = Math.sin((t / dur) * Math.PI);
            this.offsets.angleZ = p * 15.0 * alpha;
            this.offsets.angleX = -p * 5.0 * alpha;
            this.offsets.tongueBonus = p * 1.0 * alpha;
            this.offsets.cheekBonus = p * 0.65 * alpha;
            this.offsets.mouthFormBonus = p * 0.50 * alpha;
            this.offsets.exp3Bonus = p * 0.95 * alpha;
            this.offsets.shoulderL = -p * 0.25 * alpha;
            this.offsets.shoulderR = p * 0.45 * alpha;
            this.offsets.armR = p * 0.30 * alpha;
            this.offsets.sleeveR = p * 0.35 * alpha;
            this.offsets.hipZ = p * 0.40 * alpha;

            this.offsets.angleX = -p * 10.0 * alpha;
            this.offsets.angleY = -p * 6.0 * alpha;
            this.offsets.shoulderL = p * 0.35 * alpha;
            this.offsets.shoulderR = p * 0.35 * alpha;

          case 'FIDGET_SWAY': {

            const s = Math.sin((t / dur) * Math.PI);
            this.offsets.posX = s * 22.0 * alpha;
            this.offsets.bodyZ = s * 8.5 * alpha;
            this.offsets.angleZ = -s * 7.0 * alpha;
            this.offsets.angleY = s * 4.5 * alpha;
            this.offsets.hipZ = s * 0.65 * alpha;
            this.offsets.chestZ = -s * 0.45 * alpha;

          case 'SHY_HIDE': {
            // Bashful: arms pull inward protectively, head turns aside, deep blush
            const p = Math.sin((t / dur) * Math.PI);
            this.offsets.angleY = -p * 14.0 * alpha;
            this.offsets.angleZ = p * 10.0 * alpha;
            this.offsets.angleX = -p * 8.0 * alpha;
            this.offsets.shoulderL = -p * 0.35 * alpha;
            this.offsets.shoulderR = -p * 0.35 * alpha;
            this.offsets.armL = -p * 0.25 * alpha;
            this.offsets.armR = -p * 0.25 * alpha;
            this.offsets.sleeveL = -p * 0.30 * alpha;
            this.offsets.sleeveR = -p * 0.30 * alpha;
            this.offsets.cheekBonus = p * 0.95 * alpha;
            this.offsets.eyeSmileBonus = p * 0.60 * alpha;
            this.offsets.mouthFormBonus = p * 0.35 * alpha;
            break;
          }

          case 'WINK_HAPPY': {
            // Bright cheerful wink with cute head tilt and shoulder perk
            const p = Math.sin((t / dur) * Math.PI);
            this.offsets.angleZ = -p * 11.0 * alpha;
            this.offsets.angleY = p * 5.0 * alpha;
            this.offsets.exp3Bonus = p * 1.0 * alpha;
            this.offsets.eyeSmileBonus = p * 0.85 * alpha;
            this.offsets.mouthFormBonus = p * 0.75 * alpha;
            this.offsets.cheekBonus = p * 0.50 * alpha;
            this.offsets.shoulderR = p * 0.35 * alpha;
            this.offsets.sleeveR = p * 0.30 * alpha;
            this.offsets.posY = p * 10.0 * alpha;
            break;
          }
        }
      }
    }

    // ══════════════════════════════════════════════════════════════════════════

    // ══════════════════════════════════════════════════════════════════════════
    // 4. CONTROLADOR DE FLOTACIÓN HOLOGRÁFICA (HolographicFloatController)
    // ══════════════════════════════════════════════════════════════════════════
    class HolographicFloatController {
      constructor() {
        this.phase = 0.0;
        this.currentMode = 'IDLE';
        this.speed = 1.0;
        this.amplitudeMultiplier = 1.0;
        this.enabled = true;

        // Salidas suavizadas
        this.floatY = 0.0;
        this.floatX = 0.0;
        this.floatScale = 1.0;
        this.bodyTiltZ = 0.0;
        this.chestTiltZ = 0.0;
        this.hipTiltZ = 0.0;

        // Parámetros de transición por estado
        this.targetBaseElevation = 0.0;
        this.currentBaseElevation = 0.0;
        this.targetAmpY = 13.5;
        this.currentAmpY = 13.5;
        this.targetSpeed = 0.85;
        this.currentSpeed = 0.85;
      }

      setMode(mode) {
        this.currentMode = String(mode || 'IDLE').toUpperCase();
        switch (this.currentMode) {
          case 'SLEEPING':
            this.targetAmpY = 5.0;
            this.targetSpeed = 0.45;
            this.targetBaseElevation = 4.0;
            break;
          case 'LISTENING':
            this.targetAmpY = 7.5;
            this.targetSpeed = 0.80;
            this.targetBaseElevation = -2.0;
            break;
          case 'THINKING':
          case 'SEARCHING':
          case 'ANALYZING':
            this.targetAmpY = 11.0;
            this.targetSpeed = 1.25;
            this.targetBaseElevation = -13.0; // Elevación ascendente sutil al computar
            break;
          case 'SPEAKING':
            this.targetAmpY = 8.5;
            this.targetSpeed = 0.95;
            this.targetBaseElevation = -5.0;
            break;
          case 'ELEGANT_BOW':
          case 'WELCOME_PRESENT':
            this.targetAmpY = 10.0;
            this.targetSpeed = 1.05;
            this.targetBaseElevation = -6.0;
            break;
          case 'ERROR':
            this.targetAmpY = 6.0;
            this.targetSpeed = 0.70;
            this.targetBaseElevation = 2.0;
            break;
          default: // IDLE
            this.targetAmpY = 13.5;
            this.targetSpeed = 0.85;
            this.targetBaseElevation = 0.0;
            break;
        }
      }

      update(dt, state, isSpeaking) {
        if (!this.enabled) {
          this.floatY = 0.0;
          this.floatX = 0.0;
          this.floatScale = 1.0;
          this.bodyTiltZ = 0.0;
          this.chestTiltZ = 0.0;
          this.hipTiltZ = 0.0;
          return;
        }

        const effectiveState = isSpeaking ? 'SPEAKING' : state;
        if (effectiveState !== this.currentMode && this.currentMode !== 'ELEGANT_BOW') {
          this.setMode(effectiveState);
        }

        // Interpolación gradual de estado
        this.currentAmpY += (this.targetAmpY * this.amplitudeMultiplier - this.currentAmpY) * Math.min(1.0, dt * 2.5);
        this.currentSpeed += (this.targetSpeed * this.speed - this.currentSpeed) * Math.min(1.0, dt * 2.5);
        this.currentBaseElevation += (this.targetBaseElevation - this.currentBaseElevation) * Math.min(1.0, dt * 3.0);

        // Fase continua e ininterrumpida
        this.phase += dt * (1.55 * this.currentSpeed);

        // Oscilación vertical multi-armónica (Y)
        const sin1 = Math.sin(this.phase);
        const sin2 = Math.sin(this.phase * 0.48 + 1.15);
        this.floatY = this.currentBaseElevation + (sin1 * 0.78 + sin2 * 0.22) * this.currentAmpY;

        // Deriva horizontal lenta (X)
        this.floatX = Math.sin(this.phase * 0.52 + 0.8) * (this.currentAmpY * 0.26);

        // Pulsación sutil de profundidad 3D (0.35%)
        this.floatScale = 1.0 + (sin1 * 0.0035);

        // Micro-torsión física en columna y cadera
        this.bodyTiltZ = sin1 * 1.35;
        this.chestTiltZ = sin2 * 0.85;
        this.hipTiltZ = -sin1 * 1.10;
      }
    }

    // ══════════════════════════════════════════════════════════════════════════
    // 4.5 MOTOR CINEMÁTICO DE VIDEOJUEGO Y ACCESORIOS (EdithGameMotionEngine)
    // ══════════════════════════════════════════════════════════════════════════
    class EdithGameMotionEngine {
      constructor(app) {
        this.app = app;
        this.t = 0.0;
        this.gameMode = 'idle'; // 'idle', 'combat', 'study', 'celebrate'
        this.gameModeTimer = 0.0;

        // RPG Weight shifting stance
        this.stanceCycleTimer = 0.0;
        this.stanceNextShift = 4.5;
        this.targetWeightShift = 0.0; // -1.0 (left foot) to 1.0 (right foot)
        this.currentWeightShift = 0.0;
        this.footAngleL = 0.0;
        this.footAngleR = 0.0;
        this.hipUp = 0.0;
        this.hipDown = 0.0;

        // Props state
        this.props = {
          grimoire: { active: false, timer: 0.0, pageTurn: 0.0, value: 0.0 },
          hologramRings: { active: false, timer: 0.0, rot: 0.0, flip: 0.0, persp: 0.0, circles: [0, 0, 0, 0], value: 0.0 },
          flameAura: { active: false, timer: 0.0, flicker: 0.0, value: 0.0, rot: 0.0 }
        };

        // Animal/Fantasy Secondary Physics (Wings, Tail, Hat Ears)
        this.wingWave = 0.0;
        this.wings = [0, 0, 0, 0]; // L1..4, R1..4
        this.tailWave = 0.0;
        this.tailNodes = [0, 0, 0, 0, 0, 0, 0]; // 1..7
        this.earTwitchTimer = 0.0;
        this.earTwitchNext = 3.5;
        this.earTwitchL = 0.0;
        this.earTwitchR = 0.0;

        // Living Mascot Doll Companion
        this.doll = {
          x: 0.0,
          y: 0.0,
          z: 0.0,
          angleL: 0.0,
          angleR: 0.0,
          earL: 0.0,
          earR: 0.0,
          tail: 0.0,
          arm: 0.0,
          phase: 0.0,
          tapTimer: 0.0
        };

        // Expression Tremors / Anime FX
        this.pupilQuake = 0.0;
        this.eyeSquint = 0.0;
      }

      setGameMode(mode) {
        this.gameMode = mode || 'idle';
        if (mode === 'combat') {
          this.setPropState('flameAura', true, 6.0);
          this.setPropState('hologramRings', true, 6.0);
        } else if (mode === 'study') {
          this.setPropState('hologramRings', true, 8.0);
          this.setPropState('hologramRings', true, 8.0);
        } else if (mode === 'celebrate') {
          this.setPropState('flameAura', true, 3.5);
          this.setPropState('hologramRings', true, 3.5);
        }
      }

      setPropState(name, active, duration = 0.0) {
        let key = name;
        if (name === 'book' || name === 'grimoire' || name === 'tablet') key = 'grimoire';
        if (name === 'rings' || name === 'hologram' || name === 'hologram_rings') key = 'hologramRings';
        if (name === 'fire' || name === 'flame' || name === 'aura' || name === 'halo') key = 'flameAura';

        if (this.props[key]) {
          this.props[key].active = Boolean(active);
          this.props[key].timer = duration > 0 ? duration : (active ? 999999 : 0.0);
        }
      }

      triggerDollInteraction() {
        this.doll.tapTimer = 2.4;
      }

      triggerShock() {
        this.pupilQuake = 1.0;
      }

      update(dt, state, isSpeaking) {
        this.t += dt;
        const isSleep = (state === 'SLEEPING');

        // ── 1. Weight Shifting Stance ──────────────────────────────────────────
        if (isSleep) {
          this.targetWeightShift = 0.0;
        } else {
          this.stanceCycleTimer += dt;
          if (this.stanceCycleTimer >= this.stanceNextShift) {
            this.stanceCycleTimer = 0.0;
            this.stanceNextShift = 4.0 + Math.random() * 4.5;
            const pick = Math.random();
            if (pick < 0.40) {
              this.targetWeightShift = 0.45 + Math.random() * 0.45; // right foot forward
            } else if (pick < 0.80) {
              this.targetWeightShift = -(0.45 + Math.random() * 0.45); // left foot forward
            } else {
              this.targetWeightShift = (Math.random() - 0.5) * 0.3; // relaxed center
            }
          }
        }

        // Smooth stance interpolation
        this.currentWeightShift += (this.targetWeightShift - this.currentWeightShift) * Math.min(1.0, dt * 2.2);

        // Foot angles and hip tilting
        const stanceStrength = isSleep ? 0.2 : 1.0;
        this.footAngleL = -this.currentWeightShift * 8.5 * stanceStrength;
        this.footAngleR = this.currentWeightShift * 8.5 * stanceStrength;
        this.hipUp = Math.max(0, this.currentWeightShift) * 0.75 * stanceStrength;
        this.hipDown = Math.max(0, -this.currentWeightShift) * 0.75 * stanceStrength;

        // ── 2. Props Management ──────────────────────────────────────────────
        // Grimoire / Tablet
        const pGrim = this.props.grimoire;
        if (pGrim.timer > 0) {
          pGrim.timer -= dt;
          if (pGrim.timer <= 0) pGrim.active = false;
        }
        const targetGrim = pGrim.active && !isSleep ? 1.0 : 0.0;
        pGrim.value += (targetGrim - pGrim.value) * Math.min(1.0, dt * 5.0);
        if (pGrim.value > 0.05) {
          pGrim.pageTurn = (Math.sin(this.t * 3.2) + 1.0) * 0.5;
        } else {
          pGrim.pageTurn = 0.0;
        }

        // Holographic Rings & Glyphs
        const pRings = this.props.hologramRings;
        if (pRings.timer > 0) {
          pRings.timer -= dt;
          if (pRings.timer <= 0) pRings.active = false;
        }
        const targetRings = pRings.active && !isSleep ? 1.0 : 0.0;
        pRings.value += (targetRings - pRings.value) * Math.min(1.0, dt * 4.5);
        if (pRings.value > 0.01) {
          pRings.rot = (pRings.rot + dt * 140.0) % 360;
          pRings.flip = Math.sin(this.t * 2.8) * 30.0;
          pRings.persp = (Math.sin(this.t * 1.6) + 1.0) * 0.5;
          for (let c = 0; c < 4; c++) {
            pRings.circles[c] = (this.t * (80.0 + c * 35.0)) % 360;
          }
        }

        // Jibril-style Rotating Anime Light Halo (replaces Flame Aura / Spirit)
        const pFlame = this.props.flameAura;
        if (pFlame.timer > 0) {
          pFlame.timer -= dt;
          if (pFlame.timer <= 0) pFlame.active = false;
        }
        const targetFlame = pFlame.active && !isSleep ? 1.0 : 0.0;
        pFlame.value += (targetFlame - pFlame.value) * Math.min(1.0, dt * 5.5);
        if (pFlame.value > 0.005) {
          pFlame.rot = (pFlame.rot + dt * 0.92) % (Math.PI * 2);
          pFlame.flicker = Math.max(0.0, Math.min(1.0, pFlame.value * (0.9 + Math.sin(this.t * 4.5) * 0.1)));
        } else {
          pFlame.flicker = 0.0;
        }

        // ── 3. Fantasy Secondary Physics (Wings, Tail, Hat Ears) ──────────────
        // Wings flutter wave
        const wingSpeed = isSleep ? 0.7 : (isSpeaking ? 3.6 : 2.0);
        this.wingWave += dt * wingSpeed;
        for (let i = 0; i < 4; i++) {
          const lag = i * 0.28;
          this.wings[i] = Math.sin(this.wingWave - lag) * (1.0 - i * 0.18);
        }

        // Tail whip-like sinusoidal chain
        const tailSpeed = isSleep ? 0.8 : (isSpeaking ? 2.8 : 1.7);
        this.tailWave += dt * tailSpeed;
        for (let i = 0; i < 7; i++) {
          const phaseLag = i * 0.42;
          this.tailNodes[i] = Math.sin(this.tailWave - phaseLag) * (1.0 - i * 0.08);
        }

        // Hat Ears twitch
        if (!isSleep) {
          this.earTwitchTimer += dt;
          if (this.earTwitchTimer >= this.earTwitchNext) {
            this.earTwitchTimer = 0.0;
            this.earTwitchNext = 3.0 + Math.random() * 4.5;
            if (Math.random() < 0.5) {
              this.earTwitchL = 1.0;
            } else {
              this.earTwitchR = 1.0;
            }
          }
        }
        this.earTwitchL += (0.0 - this.earTwitchL) * Math.min(1.0, dt * 14.0);
        this.earTwitchR += (0.0 - this.earTwitchR) * Math.min(1.0, dt * 14.0);

        // ── 4. Living Mascot Doll Companion ──────────────────────────────────
        this.doll.phase += dt * (isSleep ? 1.0 : 2.4);
        if (this.doll.tapTimer > 0) {
          this.doll.tapTimer -= dt;
          this.doll.arm = Math.sin(this.t * 28.0) * 0.85;
          this.doll.earL = Math.sin(this.t * 32.0) * 0.95;
          this.doll.earR = -Math.sin(this.t * 32.0) * 0.95;
          this.doll.tail = Math.sin(this.t * 24.0) * 0.9;
          this.doll.angleL = Math.sin(this.t * 18.0) * 15.0;
          this.doll.angleR = -this.doll.angleL;
          this.doll.x = Math.sin(this.t * 16.0) * 8.0;
          this.doll.y = Math.abs(Math.sin(this.t * 18.0)) * 14.0;
        } else {
          const dSin = Math.sin(this.doll.phase);
          const dCos = Math.cos(this.doll.phase * 0.85);
          this.doll.arm = dSin * 0.25;
          this.doll.earL = dCos * 0.20;
          this.doll.earR = -dCos * 0.20;
          this.doll.tail = dSin * 0.35;
          this.doll.angleL = dSin * 4.0;
          this.doll.angleR = -dSin * 4.0;
          this.doll.x = dCos * 2.5;
          this.doll.y = dSin * 4.0;
        }

        // ── 5. Expression Tremors ────────────────────────────────────────────
        this.pupilQuake += (0.0 - this.pupilQuake) * Math.min(1.0, dt * 8.0);
        this.eyeSquint += (0.0 - this.eyeSquint) * Math.min(1.0, dt * 5.0);
      }
    }
