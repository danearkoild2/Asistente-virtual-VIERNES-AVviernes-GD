      setSemanticIntent(intent, metadata) {
        intent = String(intent || 'neutral').toLowerCase().trim();
        metadata = metadata || {};

        let gestureKey = '';
        switch (intent) {
          case 'explain':
          case 'explaining':
            this.speechSegmentCount++;
            if (this.speechSegmentCount % 3 === 0) {
              gestureKey = 'EXPLAIN_BOTH';
            } else if (this.lastArmUsed === 'left') {
              gestureKey = 'EXPLAIN_RIGHT';
              this.lastArmUsed = 'right';
            } else {
              gestureKey = 'EXPLAIN_LEFT';
              this.lastArmUsed = 'left';
            }
            break;

          case 'emphasize':
          case 'emphasis':
          case 'important':
            gestureKey = 'EMPHASIZE';
            break;

          case 'present':
          case 'presentation':
          case 'options':
            gestureKey = (metadata.side === 'right') ? 'PRESENT_RIGHT' : 'PRESENT_LEFT';
            break;

          case 'confirm':
          case 'confirmed':
          case 'agree':
            gestureKey = 'CONFIRM';
            break;

          case 'think':
          case 'search':
          case 'searching':
          case 'analyze':
          case 'analyzing':
            gestureKey = 'THINK_ANALYZE';
            break;

          case 'warn':
          case 'warning':
          case 'caution':
            gestureKey = 'WARN_CAUTION';
            break;

          case 'apologize':
          case 'sorry':
            gestureKey = 'APOLOGIZE';
            break;

          case 'discover':
          case 'discovery':
            gestureKey = 'DISCOVER';
            break;

          case 'celebrate':
          case 'victory':
            gestureKey = 'GAME_VICTORY_CELEBRATE';
            break;

          case 'read':
          case 'grimoire':
          case 'study':
            gestureKey = 'GAME_SUMMON_HUD';
            break;

          case 'hud':
          case 'summon':
            gestureKey = 'GAME_SUMMON_HUD';
            break;

          case 'doll':
            gestureKey = 'GAME_VICTORY_CELEBRATE';
            break;

          case 'combat':
          case 'battle':
            gestureKey = 'GAME_COMBAT_READY';
            break;

          case 'shock':
            gestureKey = 'GAME_SURPRISED_SHOCK';
            break;

          case 'pout':
            gestureKey = 'GAME_POUT_PLAYFUL';
            break;

          case 'headpat':
            gestureKey = 'GAME_HEADPAT_REACTION';
            break;

          case 'stretch':
            gestureKey = 'GAME_STRETCH_RELAX';
            break;

          case 'scratch':
            gestureKey = 'GAME_CONFUSED_SCRATCH';
            break;

          case 'inspect':
            gestureKey = 'GAME_CURIOUS_INSPECT';
            break;

          case 'greet':
          case 'greeting':
          case 'hello':
            gestureKey = 'GREETING';
            break;

          case 'farewell':
          case 'bye':
            gestureKey = 'FAREWELL';
            break;

          case 'idle':
          case 'neutral':
          default:
            return;
        }

        if (gestureKey) {
          const intensity = Number(metadata.intensity) || 1.0;
          const duration = Number(metadata.duration) || 0.0;
          this.triggerGesture(gestureKey, duration, intensity);
        }
      }

      triggerGesture(name, duration = 0.0, intensity = 1.0) {
        name = String(name || '').toUpperCase().trim();
        const def = this.definitions[name];
        if (!def) {
          console.warn("[GestureController] Gesto no reconocido:", name);
          return false;
        }

        this.activeGesture = def;
        this.gestureName = name;
        this.elapsed = 0.0;
        this.duration = (duration > 0.0) ? duration : def.duration;
        this.attackTime = def.attack || 0.45;
        this.releaseTime = def.release || 0.65;
        this.intensity = Math.max(0.2, Math.min(1.5, Number(intensity) || 1.0));

        if (def.emotion && this.app && this.app.emotions) {
          this.app.emotions.setEmotion(def.emotion, (def.emotionIntensity || 0.8) * this.intensity, this.duration);
        }

        return true;
      }

      interrupt() {
        if (this.activeGesture) {
          // Recuperación acelerada a neutral en 0.22 s
          this.releaseTime = 0.22;
          this.elapsed = Math.max(this.elapsed, this.duration - this.releaseTime);
        }
      }

      update(dt, state, isSpeaking) {
        if (!this.activeGesture) {
          for (const k in this.offsets) {
            this.offsets[k] += (0.0 - this.offsets[k]) * Math.min(1.0, dt * 5.5);
          }
          return;
        }

        this.elapsed += dt;
        if (this.elapsed >= this.duration) {
          this.activeGesture = null;
          this.gestureName = '';
          return;
        }

        let weight = 0.0;
        const t = this.elapsed;
        const dur = this.duration;
        const att = this.attackTime;
        const rel = this.releaseTime;

        if (t < att) {
          const p = t / att;
          weight = p * p * (3.0 - 2.0 * p);
        } else if (t < (dur - rel)) {
          const sustainPhase = (t - att) * 2.2;
          weight = 1.0 + Math.sin(sustainPhase) * 0.04;
        } else {
          const p = (dur - t) / rel;
          weight = p * p * (3.0 - 2.0 * p);
        }

        weight = Math.max(0.0, Math.min(1.0, weight)) * this.intensity;

        const pMap = this.activeGesture.params || {};
        for (const k in this.offsets) {
          const target = (pMap[k] !== undefined) ? (pMap[k] * weight) : 0.0;
          this.offsets[k] += (target - this.offsets[k]) * Math.min(1.0, dt * 14.0);
        }
      }
    }

    // 6. APLICACIÓN PRINCIPAL EDITH LIVE2D PRO (EdithLive2DApp)
    // ══════════════════════════════════════════════════════════════════════════
    class EdithLive2DApp {
      constructor() {
        this.container = document.getElementById('canvas-container');
        this.loadingOverlay = document.getElementById('loading-overlay');
        this.loadingText = document.getElementById('loading-text');
        this.debugHud = document.getElementById('debug-hud');
        this.canvas = document.getElementById('canvas');

        this.app = null;
        this.model = null;
        this.core = null;
        this.isLoaded = false;
        this.isRunning = true;
        this.showDebug = false;

        // Assistant State
        this.state = 'IDLE'; // IDLE, LISTENING, THINKING, SPEAKING, SLEEPING, MUTED
        this.speaking = false;
        this.amplitude = 0.0;
        this.smoothedAmp = 0.0;

        // Subsystems
        this.emotions = new EdithEmotionEngine();
        this.gaze = new EdithGazeController();
        this.spontaneous = new EdithSpontaneousEngine(this);
        this.floater = new HolographicFloatController();
        this.gestures = new GestureController(this);
        this.gameMotion = new EdithGameMotionEngine(this);

        // Natural Human Blinking System
        this.blinkTimer = 0.0;
        this.nextBlink = 3.2;
        this.isBlinking = false;
        this.blinkProgress = 0.0;
        this.isDoubleBlink = false;
        this.doubleBlinkPending = false;

        // Respiration
        this.breathePhase = 0.0;

        // Lip-Sync Formants
        this.formantTimer = 0.0;
        this.currentFormant = 0.25;
        this.mouthTarget = 0.0;
        this.mouthCurrent = 0.0;

        // Base Scale & Position cache
        this.baseScale = 1.0;
        this.baseX = 0.0;
        this.baseY = 0.0;
        this.presentationMode = false;
        this.currentPresentationOffset = 0.0;
        this.targetPresentationOffset = 0.0;

        this.fpsCounter = 0;
        this.fpsTimer = 0;
        this.currentFps = 60;

        this.init();
      }

      init() {
        const w = window.innerWidth || 700;
        const h = window.innerHeight || 800;

        try {
          if (typeof PIXI !== 'undefined' && PIXI.settings) {
            PIXI.settings.PREFER_ENV = PIXI.ENV.WEBGL2 || PIXI.ENV.WEBGL;
            PIXI.settings.ROUND_PIXELS = true;
          }
        } catch (e) {}

        const opts = {
          view: this.canvas,
          transparent: true,
          autoDensity: true,
          antialias: true,
          preserveDrawingBuffer: false, // Optimización Pro: elimina copias de framebuffer duplicadas en RAM/VRAM
          resolution: Math.min(window.devicePixelRatio || 1, 1.25), // Optimización Pro: ultra nitidez sin sobrecargar GPU en 4K/HiDPI
          width: w,
          height: h,
          backgroundAlpha: 0,
          powerPreference: "high-performance" // Optimización Pro: aceleración gráfica dedicada de baja latencia
        };

        try {
          this.app = new PIXI.Application(opts);
        } catch (e) {
          console.warn("Pixi primary init fallback, retrying with minimal context:", e);
          try {
            this.app = new PIXI.Application({
              view: this.canvas,
              transparent: true,
              width: w,
              height: h,
              backgroundAlpha: 0
            });
          } catch (e2) {
            console.error("Pixi fatal init failure:", e2);
          }
        }

        // Robust WebGL context recovery on graphics driver suspend / wake
        this.canvas.addEventListener('webglcontextlost', (e) => {
          e.preventDefault();
          console.warn("[Live2D Pro] WebGL Context lost. Pausing rendering pipeline...");
          this.pauseRendering();
        }, false);

        this.canvas.addEventListener('webglcontextrestored', () => {
          console.log("[Live2D Pro] WebGL Context restored. Rebuilding shaders and resuming...");
          if (this.currentModelUrl) {
            this.loadModel(this.currentModelUrl);
          }
          this.resumeRendering();
        }, false);

        // Window resize
        window.addEventListener('resize', () => this.onResize());

        // Dynamic resource suspension: pause WebGL when tab/window is hidden or minimized
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) {
            this.pauseRendering();
          } else {
            this.resumeRendering();
          }
        });

        // Mouse tracking for contextual gaze
        window.addEventListener('mousemove', (e) => {
          const nx = (e.clientX / window.innerWidth) * 2 - 1;
          const ny = -(e.clientY / window.innerHeight) * 2 + 1;
          this.gaze.onMouseMove(Math.max(-1.0, Math.min(1.0, nx)), Math.max(-1.0, Math.min(1.0, ny)));
        });

        window.addEventListener('mouseleave', () => {
          this.gaze.onMouseLeave();
        });

        // Interactive tactile pointer click and double-click hit-testing
        this.canvas.addEventListener('pointerdown', (e) => this.onPointerDown(e));
        this.canvas.addEventListener('dblclick', (e) => this.onDoubleClick(e));

        // Initialize Magical Firefly companion system & connect to Gaze Controller
        this.firefly = new EdithFireflySystem('firefly-canvas');
        this.gaze.firefly = this.firefly;

        // Load initial Model (from URL query parameter if present, otherwise default to Edith)
        const params = new URLSearchParams(window.location.search);
        const initialModel = params.get('model') || '../../edith/edith.model3.json';
        this.loadModel(initialModel);
      }

      loadModel(url) {
        if (!url) return;
        this.currentModelUrl = url;

        // Clean up previous model if switching
        if (this.model) {
          try {
            this.app.stage.removeChild(this.model);
            this.model.destroy({ children: true });
          } catch(e) {
            console.warn("Error cleaning up previous Live2D model:", e);
          }
          this.model = null;
          this.core = null;
          this.isLoaded = false;
        }

        // Check if loading custom Edith AI Mesh Model (*.edith2d.json or *.r2d.json)
        if (url.endsWith('.edith2d.json') || url.endsWith('.r2d.json')) {
          this.loadEdith2DMeshModel(url);
          return;
        }

        if (this.loadingOverlay) {
          this.loadingOverlay.style.display = 'flex';
          this.loadingOverlay.style.opacity = '1';
          if (this.loadingText) {
            this.loadingText.innerText = "Preparando presencia…";
            this.loadingText.style.color = "#A0A0AB";
          }
        }

        PIXI.live2d.Live2DModel.from(url, { autoInteract: false, autoUpdate: false })
          .then(model => {
            this.model = model;
            this.core = model.internalModel ? model.internalModel.coreModel : null;
            this._buildParameterIndexCache();

            this.app.stage.addChild(model);

            if (model.internalModel) {
              model.internalModel.eyeBlink = undefined; // Controlled by our human physics
            }

            this.fitModel();
            this.isLoaded = true;
            this.hideLoading();

            if (!this._tickerAdded) {
              this.app.ticker.add((delta) => this.onTick(delta));
              this._tickerAdded = true;
            }
            console.log("Live2D Model Initialized Successfully:", url);
          })
          .catch(err => {
            console.error("Error cargando Live2D:", err);
            if (url.includes('edith.model3.json')) {
              console.log("Reintentando con edith_hq.model3.json...");
              this.loadModel('../../edith/edith_hq.model3.json');
            } else {
              this.onError("Error cargando modelo Live2D: " + url);
            }
          });
      }

      loadEdith2DMeshModel(url) {
        if (this.loadingOverlay) {
          this.loadingOverlay.style.display = 'flex';
          this.loadingOverlay.style.opacity = '1';
          if (this.loadingText) {
            this.loadingText.innerText = "CARGANDO MODELO 2D AI DE EDITH...";
            this.loadingText.style.color = "#38bdf8";
          }
        }

        const baseUrl = url.substring(0, url.lastIndexOf('/') + 1);
        fetch(url)
          .then(res => res.json())
          .then(rigData => {
            const container = new PIXI.Container();
            container.canvasWidth = rigData.canvas_width || 500;
            container.canvasHeight = rigData.canvas_height || 500;

            const partsList = Object.values(rigData.parts || {}).sort((a, b) => (a.draw_order || 0) - (b.draw_order || 0));
            const activeMeshes = [];

            partsList.forEach(part => {
              if (!part.mesh || !part.mesh.vertices || part.mesh.vertices.length === 0) return;
              const texUrl = baseUrl + part.texture_path;
              const tex = PIXI.Texture.from(texUrl);

              const flatVerts = new Float32Array(part.mesh.vertices.flat());
              const flatUvs = new Float32Array(part.mesh.uvs.flat());
              const flatIndices = new Uint16Array(part.mesh.triangles.flat());

              const mesh = new PIXI.SimpleMesh(tex, flatVerts, flatUvs, flatIndices, PIXI.DRAW_MODES.TRIANGLES);
              mesh.origVerts = new Float32Array(flatVerts);
              mesh.partData = part;
              mesh.alpha = part.opacity !== undefined ? part.opacity : 1.0;
              mesh.visible = part.visible !== false;

              if (tex.baseTexture && !tex.baseTexture.valid) {
                tex.baseTexture.once('loaded', () => {
                  if (this.model === container) this.fitModel();
                });
              }

              container.addChild(mesh);
              activeMeshes.push(mesh);
            });

            const adapter = {
              parameters: {},
              dirty: true,
              setParameterValueById: (id, val) => {
                if (adapter.parameters[id] !== val) {
                  adapter.parameters[id] = val;
                  adapter.dirty = true;
                }
              }
            };

            // Container update method called on every frame by onTick
            container.update = (delta) => {
              if (!adapter.dirty) return;
              const params = adapter.parameters;

              // 2.5D Parallax & Head tracking
              const angX = (params['ParamAngleX'] || 0) / 30.0;
              const angY = (params['ParamAngleY'] || 0) / 30.0;
              const eyeBallX = (params['ParamEyeBallX'] || 0);
              const eyeBallY = (params['ParamEyeBallY'] || 0);

              activeMeshes.forEach(m => {
                const pData = m.partData;
                const pId = pData.id || '';
                const verts = m.geometry.getBuffer('aVertexPosition').data;
                const orig = m.origVerts;
                const count = orig.length / 2;

                let shiftX = 0;
                let shiftY = 0;
                if (pId === 'part_head_base' || pId === 'part_hair_front' || pId === 'part_hair_back') {
                  shiftX = angX * 16.0;
                  shiftY = angY * 12.0;
                } else if (pId === 'part_eye_left' || pId === 'part_eye_right') {
                  shiftX = angX * 18.0 + eyeBallX * 5.0;
                  shiftY = angY * 14.0 - eyeBallY * 4.0;
                } else if (pId === 'part_mouth') {
                  shiftX = angX * 17.0;
                  shiftY = angY * 13.0;
                } else if (pId === 'part_neck') {
                  shiftX = angX * 6.0;
                  shiftY = angY * 4.0;
                }

                for (let i = 0; i < count; i++) {
                  verts[i * 2] = orig[i * 2] + shiftX;
                  verts[i * 2 + 1] = orig[i * 2 + 1] + shiftY;
                }

                if (pData.keyforms && pData.keyforms.length > 0) {
                  pData.keyforms.forEach(kf => {
                    const val = params[kf.param_id];
                    if (val === undefined || !kf.vertex_offsets) return;

                    let factor = 0;
                    if (kf.param_id && kf.param_id.includes('Eye') && kf.param_id.includes('Open')) {
                      factor = Math.max(0.0, Math.min(1.0, 1.0 - val));
                    } else if (kf.param_value !== 0) {
                      factor = Math.max(0.0, Math.min(1.0, val / kf.param_value));
                    } else {
                      factor = Math.max(0.0, Math.min(1.0, Math.abs(val)));
                    }

                    if (factor > 0.001) {
                      const offsets = kf.vertex_offsets;
                      const n = Math.min(count, offsets.length);
                      for (let i = 0; i < n; i++) {
                        verts[i * 2] += offsets[i][0] * factor;
                        verts[i * 2 + 1] += offsets[i][1] * factor;
                      }
                    }
                  });
                }

                m.geometry.getBuffer('aVertexPosition').update();
              });
              adapter.dirty = false;
            };

            this.model = container;
            this.core = adapter;
            this.app.stage.addChild(container);

            this.fitModel();
            this.isLoaded = true;
            this.hideLoading();

            if (!this._tickerAdded) {
              this.app.ticker.add((delta) => this.onTick(delta));
              this._tickerAdded = true;
            }
            console.log("Edith 2D AI Mesh Model Initialized Successfully:", url);
          })
          .catch(err => {
            console.error("Error cargando Edith 2D Mesh Model:", err);
            this.onError("Error cargando Edith 2D Mesh Model: " + url);
          });
      }

      _buildParameterIndexCache() {
        this.paramMap = new Map();
        if (!this.core) return;
        try {
          const ids = this.core._parameterIds || (this.core.parameters ? this.core.parameters.ids : null);
          if (ids && ids.length) {
            for (let i = 0; i < ids.length; i++) {
              this.paramMap.set(ids[i], i);
            }
          }
        } catch (e) {
          console.warn("[Live2D Pro] Error construyendo mapa de parámetros:", e);
        }
      }

      setParam(paramId, val) {
        if (!this.core) return;
        const values = this.core._parameterValues || (this.core.parameters ? this.core.parameters.values : null);
        if (values && this.paramMap) {
          const idx = this.paramMap.get(paramId);
          if (idx !== undefined) {
            values[idx] = val;
            return;
          }
        }
        if (typeof this.core.setParameterValueById === 'function') {
          this.core.setParameterValueById(paramId, val);
        }
      }

      setCoreParam(paramId, val, aliases = []) {
        if (!this.core) return;
        const values = this.core._parameterValues || (this.core.parameters ? this.core.parameters.values : null);
        if (values && this.paramMap) {
          const idx = this.paramMap.get(paramId);
          if (idx !== undefined) {
            values[idx] = val;
          }
          for (let i = 0; i < aliases.length; i++) {
            const aIdx = this.paramMap.get(aliases[i]);
            if (aIdx !== undefined) {
              values[aIdx] = val;
            }
          }
          return;
        }
        if (typeof this.core.setParameterValueById === 'function') {
          this.core.setParameterValueById(paramId, val);
          for (let i = 0; i < aliases.length; i++) {
            this.core.setParameterValueById(aliases[i], val);
          }
        }
      }

      fitModel() {
        if (!this.model) return;
        const w = window.innerWidth || 700;
        const h = window.innerHeight || 800;
        this.app.renderer.resize(w, h);

        let mw = 3893;
        let mh = 9000;
        if (this.model.canvasWidth && this.model.canvasHeight) {
          mw = this.model.canvasWidth;
          mh = this.model.canvasHeight;
        } else if (this.model.internalModel && this.model.internalModel.width && this.model.internalModel.height) {
          mw = this.model.internalModel.width;
          mh = this.model.internalModel.height;
        } else if (this.model.width && this.model.height) {
          const sx = (this.model.scale && this.model.scale.x) ? this.model.scale.x : 1;
          const sy = (this.model.scale && this.model.scale.y) ? this.model.scale.y : 1;
          mw = this.model.width / sx;
          mh = this.model.height / sy;
        }

        this.modelRawW = mw;
        this.modelRawH = mh;

        // Dynamic framing: cuerpo completo visible siempre, sin recorte
        const aspectModel = mh / (mw || 1);
        if (aspectModel > 1.2) {
          // Personaje alto (HuoHuo, cuerpo completo): escalar al 85% de la altura y anclar en la base
          // Esto garantiza un generoso espacio aéreo superior (~80-110px) para que el halo y las orejas respiren libremente
          this.baseScale = (h * 0.85) / mh;
          this.baseX = (w - mw * this.baseScale) / 2;
          this.baseY = Math.max(65, (h - mh * this.baseScale) * 0.88);
        } else {
          this.baseScale = Math.min(w / (mw * 0.90), (h * 0.85) / mh);
          this.baseX = (w - mw * this.baseScale) / 2;
          this.baseY = Math.max(55, (h - mh * this.baseScale) * 0.82);
        }

        this.model.scale.set(this.baseScale);
        this.model.x = this.baseX;
        this.model.y = this.baseY;
      }

      onResize() {
        this.fitModel();
      }

      hideLoading() {
        if (this.loadingOverlay) {
          this.loadingOverlay.style.opacity = '0';
          setTimeout(() => {
            this.loadingOverlay.style.display = 'none';
          }, 400);
        }
      }

      onError(msg) {
        if (this.loadingText) {
          this.loadingText.innerText = msg;
          this.loadingText.style.color = '#ff4466';
        }
      }

      // ── API EXTERNA (Invocada desde Python via WebEngine) ──────────────────
      setSpeaking(isSpeaking) {
        this.speaking = Boolean(isSpeaking);
      }

      setAmplitude(amp) {
        this.amplitude = Math.max(0.0, Math.min(1.0, amp));
      }

      setState(newState) {
        const prev = this.state;
        this.state = String(newState || 'IDLE').toUpperCase();

        if (this.state === 'SLEEPING') {
          this.emotions.setEmotion('sleepy', 1.0, 0.0);
          this.spontaneous.interruptAction();
        } else if (prev === 'SLEEPING' && this.state !== 'SLEEPING') {
          this.emotions.setEmotion('happy', 0.8, 2.5);
        } else if (this.state === 'THINKING') {
          this.emotions.setEmotion('curious', 0.8, 0.0);
        } else if (this.state === 'LISTENING') {
          this.emotions.setEmotion('neutral', 1.0, 0.0);
        }
      }

      glance(dx, dy, hold = 1.5) {
        this.gaze.glance(dx, dy, hold);
      }

      setEmotion(name, intensity = 1.0, duration = 0.0) {
        this.emotions.setEmotion(name, intensity, duration);
      }

      triggerAction(name) {
        return this.spontaneous.triggerAction(name, true);
      }

      setAutonomyEnabled(enabled) {
        const val = Boolean(enabled);
        this.gaze.autonomyEnabled = val;
        this.spontaneous.autonomyEnabled = val;
      }

      setSpontaneityLevel(level) {
        const lvl = Math.max(0.0, Math.min(2.0, Number(level) || 1.0));
        this.gaze.spontaneityLevel = lvl;
        this.spontaneous.spontaneityLevel = lvl;
      }

      setMood(moodName) {
        this.spontaneous.mood = String(moodName || 'cheerful').toLowerCase();
      }

      setSemanticIntent(intent, metadata) {
        if (this.gestures) {
          this.gestures.setSemanticIntent(intent, metadata);
        }
      }

      playNativeMotion(name) {
        if (!this.model) return false;
        // Pillow/book/grimoire motions are banned: redirect to a neutral motion.
        if (name === 'zhentou' || name === 'doll_poke') name = 'haoqi';
        try {
          if (typeof this.model.motion === 'function') {
            const res = this.model.motion(name);
            if (res !== false && res !== undefined) return true;
          }
        } catch (e) {}
        try {
          if (this.model.internalModel && this.model.internalModel.motionManager) {
            const mm = this.model.internalModel.motionManager;
            if (typeof mm.startMotion === 'function') {
              mm.startMotion(name, 0);
              return true;
            }
          }
        } catch (e) {}
        return false;
      }

      setExpression(name) {
        if (!this.model) return false;
        try {
          if (typeof this.model.expression === 'function') {
            this.model.expression(name);
            return true;
          }
        } catch (e) {}
        try {
          if (this.model.internalModel && this.model.internalModel.motionManager && this.model.internalModel.motionManager.expressionManager) {
            this.model.internalModel.motionManager.expressionManager.setExpression(name);
            return true;
          }
        } catch (e) {}
        return false;
      }

      triggerGesture(name, duration = 0.0, intensity = 1.0) {
        if (!name) return false;
        // Normalizar alias comunes
        if (name === 'GREETING') name = 'GREETING_WAVE';

        // 1. Intentar reproducir motion nativo registrado de Cubism (e.g. HuoHuo)
        if (this.playNativeMotion(name)) {
          return true;
        }

        // 2. Fallback a biblioteca procedimental de gestos
        if (this.gestures) {
          return this.gestures.triggerGesture(name, duration, intensity);
        }
        return false;
      }

      interruptGestures() {
        if (this.gestures) this.gestures.interrupt();
        if (this.spontaneous) this.spontaneous.interruptAction();
      }

      setFloatMode(mode) {
        if (this.floater) this.floater.setMode(mode);
      }

      setFloatParams(speed, amp) {
        if (this.floater) {
          if (speed !== undefined) this.floater.speed = Number(speed) || 1.0;
          if (amp !== undefined) this.floater.amplitudeMultiplier = Number(amp) || 1.0;
        }
      }

      setPresentationMode(active) {
        this.presentationMode = Boolean(active);
        const w = window.innerWidth || 700;
        this.targetPresentationOffset = this.presentationMode ? (-Math.min(190, w * 0.22)) : 0.0;
        if (this.presentationMode) {
          this.gaze.glance(0.48, -0.05, 3.5);
          this.emotions.setEmotion('curious', 0.85, 3.0);
        }
      }

      setDebugMode(enable) {
        this.showDebug = Boolean(enable);
        if (this.debugHud) {
          this.debugHud.style.display = this.showDebug ? 'block' : 'none';
        }
      }

      getStatus() {
        return {
          state: this.state,
          emotion: this.emotions.currentEmotion,
          emotionIntensity: this.emotions.intensity,
          mood: this.spontaneous.mood,
          gazeMode: this.gaze.mode,
          activeAction: this.spontaneous.activeAction,
          activeGesture: this.gestures ? this.gestures.gestureName : '',
          floatElevation: this.floater ? (this.floater.floatY).toFixed(1) : 0,
          autonomyEnabled: this.spontaneous.autonomyEnabled,
          spontaneityLevel: this.spontaneous.spontaneityLevel,
          speaking: this.speaking,
          amplitude: this.amplitude,
          fps: this.currentFps,
          gameMode: this.gameMotion ? this.gameMotion.gameMode : 'idle',
          grimoireActive: this.gameMotion ? this.gameMotion.props.grimoire.active : false,
          ringsActive: this.gameMotion ? this.gameMotion.props.hologramRings.active : false,
          flameActive: this.gameMotion ? this.gameMotion.props.flameAura.active : false
        };
      }

      // ── INTERACCIÓN TÁCTIL Y HIT-TESTING (Gaming Interactivity) ────────────
      onPointerDown(e) {
        if (!this.model || !this.isLoaded) return;
        const rect = this.canvas.getBoundingClientRect();
        const px = e.clientX - rect.left;
        const py = e.clientY - rect.top;

        // Visual cybernetic ripple feedback
        if (this.firefly) {
          this.firefly.spawnRipple(px, py, 'rgba(80, 220, 255, ALPHA)', 55, 95);
        }

        // Calculate model-relative coordinates
        let mw = 3893;
        let mh = 9000;
        if (this.model.canvasWidth && this.model.canvasHeight) {
          mw = this.model.canvasWidth;
          mh = this.model.canvasHeight;
        } else if (this.model.internalModel && this.model.internalModel.width && this.model.internalModel.height) {
          mw = this.model.internalModel.width;
          mh = this.model.internalModel.height;
        }
        const modelW = mw * this.baseScale;
        const modelH = mh * this.baseScale;

        // relX: 0 = center of model, -0.5 = left edge, +0.5 = right edge
        const relX = (px - this.model.x) / (modelW || 1) - 0.5;
        // relY: 0 = top of model, 1.0 = bottom of model
        const relY = (py - this.model.y) / (modelH || 1);

        // 1. Head / Hair -> Headpat reaction
        if (relY >= 0.02 && relY <= 0.22 && Math.abs(relX) <= 0.24) {
          this.interact('headpat');
          return;
        }

        // 2. Cheeks / Face -> Playful poke / Pout
        if (relY > 0.22 && relY <= 0.33 && Math.abs(relX) <= 0.20) {
          this.interact('cheek_poke');
          return;
        }

        // 3. Left Companion Doll -> Doll spin & bounce
        if (relX < -0.10 && relX > -0.50 && relY >= 0.15 && relY <= 0.55) {
          this.interact('doll_poke');
          return;
        }

        // 4. Right Grimoire / HUD sector -> Summon HUD or Read Grimoire
        if (relX > 0.10 && relX < 0.50 && relY >= 0.15 && relY <= 0.55) {
          this.interact('hud_tap');
          return;
        }

        // 5. Body / Torso -> Curious glance
        if (relY > 0.33 && relY <= 0.65 && Math.abs(relX) <= 0.26) {
          this.interact('body_tap');
          return;
        }
      }

      onDoubleClick(e) {
        if (!this.model || !this.isLoaded) return;
        const rect = this.canvas.getBoundingClientRect();
        const px = e.clientX - rect.left;
        const py = e.clientY - rect.top;

        if (this.firefly) {
          this.firefly.spawnRipple(px, py, 'rgba(255, 180, 50, ALPHA)', 85, 120);
        }

        // Double click toggles combat ready or victory celebration
        if (this.gameMotion && this.gameMotion.gameMode === 'combat') {
          this.interact('celebrate');
        } else {
          this.interact('combat');
        }
      }

      interact(type) {
        type = String(type || 'headpat').toLowerCase();

        switch (type) {
          case 'headpat':
            this.playNativeMotion('headpat') || this.playNativeMotion('Scene1');
            this.setExpression('baozhen');
            this.triggerGesture('GAME_HEADPAT_REACTION', 3.6, 1.0);
            this.emotions.setEmotion('happy', 0.95, 3.5);
            break;

          case 'cheek_poke':
            this.playNativeMotion('yaotou') || this.playNativeMotion('cheek_poke');
            this.setExpression('angry');
            this.triggerGesture('GAME_POUT_PLAYFUL', 3.2, 1.0);
            this.emotions.setEmotion('shy', 0.85, 3.0);
            break;

          case 'doll_poke':
            this.playNativeMotion('haoqi');
            if (this.gameMotion) this.gameMotion.triggerDollInteraction();
            this.triggerGesture('GAME_VICTORY_CELEBRATE', 3.4, 1.0);
            this.emotions.setEmotion('happy', 0.9, 3.2);
            break;

          case 'hud_tap':
          case 'grimoire_tap':
            this.playNativeMotion('haoqi');
            if (this.gameMotion) {
              const ringsOn = !this.gameMotion.props.hologramRings.active;
              this.gameMotion.setPropState('hologramRings', ringsOn, 5.0);
              
              if (ringsOn) {
                this.triggerGesture('GAME_SUMMON_HUD', 4.5, 1.0);
                this.emotions.setEmotion('curious', 0.9, 4.0);
              }
            }
            break;

          case 'combat':
            this.playNativeMotion('qizi') || this.playNativeMotion('combat');
            if (this.gameMotion) this.gameMotion.setGameMode('combat');
            this.triggerGesture('GAME_COMBAT_READY', 4.0, 1.0);
            this.emotions.setEmotion('enthusiastic', 1.0, 4.0);
            break;

          case 'celebrate':
          case 'victory':
            this.playNativeMotion('Scene1') || this.playNativeMotion('celebrate');
            this.setExpression('baozhen');
            if (this.gameMotion) this.gameMotion.setGameMode('celebrate');
            this.triggerGesture('GAME_VICTORY_CELEBRATE', 3.8, 1.0);
            this.emotions.setEmotion('proud', 1.0, 3.8);
            break;

          case 'shock':
            this.playNativeMotion('linghun') || this.playNativeMotion('shock');
            this.setExpression('white_eyes');
            if (this.gameMotion) this.gameMotion.triggerShock();
            this.triggerGesture('GAME_SURPRISED_SHOCK', 2.2, 1.0);
            this.emotions.setEmotion('surprised', 1.0, 2.2);
            break;

          case 'stretch':
            this.playNativeMotion('keshui') || this.playNativeMotion('stretch');
            this.triggerGesture('GAME_STRETCH_RELAX', 4.0, 1.0);
            this.emotions.setEmotion('relieved', 0.9, 4.0);
            break;

          case 'scratch':
            this.playNativeMotion('haoqi') || this.playNativeMotion('scratch');
            this.triggerGesture('GAME_CONFUSED_SCRATCH', 3.4, 1.0);
            this.emotions.setEmotion('confused', 0.85, 3.4);
            break;

          case 'inspect':
            this.playNativeMotion('haoqi') || this.playNativeMotion('inspect');
            this.triggerGesture('GAME_CURIOUS_INSPECT', 3.8, 1.0);
            this.emotions.setEmotion('curious', 0.95, 3.8);
            break;

          case 'greeting':
          case 'greeting_wave':
            this.playNativeMotion('haoqi') || this.playNativeMotion('GREETING_WAVE');
            this.triggerGesture('GREETING_WAVE', 3.4, 1.0);
            this.emotions.setEmotion('happy', 0.90, 3.0);
            break;

          case 'body_tap':
          default:
            this.playNativeMotion('haoqi');
            this.gaze.glance((Math.random() - 0.5) * 0.4, 0.2, 2.0);
            this.emotions.setEmotion('curious', 0.7, 2.0);
            break;
        }
      }

      setPropState(name, active, duration = 0) {
        if (this.gameMotion) {
          this.gameMotion.setPropState(name, active, duration);
        }
      }

      setGameMode(mode) {
        mode = String(mode || 'idle').toLowerCase();
        if (this.gameMotion) {
          this.gameMotion.setGameMode(mode);
        }
        if (mode === 'combat') {
          this.playNativeMotion('qizi') || this.playNativeMotion('combat');
          this.triggerGesture('GAME_COMBAT_READY', 4.0, 1.0);
          this.emotions.setEmotion('enthusiastic', 0.95, 4.0);
        } else if (mode === 'celebrate') {
          this.playNativeMotion('Scene1') || this.playNativeMotion('celebrate');
          this.setExpression('baozhen');
          this.triggerGesture('GAME_VICTORY_CELEBRATE', 3.8, 1.0);
          this.emotions.setEmotion('proud', 1.0, 3.8);
        } else if (mode === 'study') {
          this.playNativeMotion('haoqi') || this.playNativeMotion('curious');
          this.triggerGesture('GAME_SUMMON_HUD', 4.5, 1.0);
          this.emotions.setEmotion('curious', 0.95, 4.0);
        } else {
          this.playNativeMotion('Idle') || this.playNativeMotion('Scene1');
        }
      }

      triggerGameGesture(name, duration = 0.0, intensity = 1.0) {
        return this.triggerGesture(name, duration, intensity);
      }

      pauseRendering() {
        if (this.isRunning) {
          this.isRunning = false;
          if (this.app) this.app.stop();
        }
      }

      resumeRendering() {
        if (!this.isRunning) {
          this.isRunning = true;
          if (this.app) this.app.start();
        }
      }

      // ── BUCLE PRINCIPAL DE ANIMACIÓN (60 FPS PRO OPTIMIZED) ───────────────
      onTick(delta) {
        if (!this.isRunning || !this.isLoaded || !this.core) return;

        const dt = delta / 60.0;
        const now = Date.now() * 0.001;
        const isSleep = (this.state === 'SLEEPING');

        // CPU/GPU Eco-Throttle Adaptativo Avanzado:
        // 1) En modo reposo (Sleep): 20 FPS (omite 2 de cada 3 frames, reduce 66% de recursos)
        if (isSleep) {
          this._sleepSkip = (this._sleepSkip || 0) + 1;
          if (this._sleepSkip % 3 !== 0) return;
        } else {
          // 2) Modo Calma Estática: cuando no habla, no hay gestos ni movimiento de mouse por >2.5s,
          // regula suavemente a 30 FPS para evitar consumo innecesario de GPU/VRAM en reposo.
          const isAtCalm = !this.speaking && this.smoothedAmp < 0.025 && (!this.gestures || !this.gestures.isActive) && (!this.spontaneous || !this.spontaneous.activeAction);
          if (isAtCalm && (this.state === 'IDLE' || this.state === 'OFFLINE')) {
            this._idleCalmTimer = (this._idleCalmTimer || 0) + dt;
            if (this._idleCalmTimer > 2.5) {
              this._idleSkip = (this._idleSkip || 0) + 1;
              if (this._idleSkip % 2 !== 0) return;
            }
          } else {
            this._idleCalmTimer = 0.0;
            this._idleSkip = 0;
          }
        }

        // Medidor de FPS
        this.fpsCounter++;
        this.fpsTimer += dt;
        if (this.fpsTimer >= 1.0) {
          this.currentFps = Math.round(this.fpsCounter / this.fpsTimer);
          this.fpsCounter = 0;
          this.fpsTimer = 0;
          if (this.showDebug && this.debugHud) {
            this.updateDebugHud();
          }
        }

        // 1. Actualizar Motor de Física de Live2D o Rig 2D (cabello, lazos, deformaciones)
        if (this.model && typeof this.model.update === 'function') {
          try {
            this.model.update(delta);
          } catch (e) {
            console.warn("Model update notice:", e);
          }
        }

        // 2. Actualizar Submódulos Autónomos
        if (this.firefly) {
          try {
            this.firefly.update(dt, this.state);
          } catch (e) {
            console.warn("Firefly update error:", e);
          }
        }
        this.emotions.update(dt);
        this.gaze.update(dt, this.state, isSleep);
        this.spontaneous.update(dt, this.state, isSleep);
        this.floater.update(dt, this.state, this.speaking);
        this.gestures.update(dt, this.state, this.speaking);
        if (this.gameMotion) {
          this.gameMotion.update(dt, this.state, this.speaking);
        }

        const emo = this.emotions.current;
        const act = this.spontaneous.offsets;
        const flt = this.floater;
        const gst = this.gestures.offsets;

        // 3. Sincronización Labial y Fonemas (Lip-Sync)
        this.smoothedAmp += (this.amplitude - this.smoothedAmp) * Math.min(1.0, dt * 18.0);
        const isSpeaking = this.speaking && !isSleep && this.smoothedAmp > 0.035;

        if (isSpeaking) {
          this.formantTimer += dt;
          if (this.formantTimer > 0.11) {
            this.formantTimer = 0;
            const forms = [0.15, 0.50, 0.85, 0.30, -0.10, 0.65];
            this.currentFormant = forms[Math.floor(Math.random() * forms.length)];
          }
          this.mouthTarget = Math.min(1.7, this.smoothedAmp * 1.95);
        } else {
          this.mouthTarget = 0.0;
          this.currentFormant = isSleep ? 0.10 : emo.mouthForm;
        }

        this.mouthCurrent += (this.mouthTarget - this.mouthCurrent) * Math.min(1.0, dt * 22.0);

        // 4. Parpadeo Biológico Multi-Fase
        let eyeOpen = 1.0;
        if (isSleep) {
          eyeOpen = 0.0;
        } else {
          this.blinkTimer += dt;
          if (!this.isBlinking && this.blinkTimer >= this.nextBlink) {
            this.isBlinking = true;
            this.blinkProgress = 0.0;
            this.isDoubleBlink = (Math.random() < 0.22);
          }

          if (this.isBlinking) {
            this.blinkProgress += dt * 7.8;
            if (this.blinkProgress < 0.45) {
              eyeOpen = Math.max(0.0, 1.0 - (this.blinkProgress / 0.45));
            } else if (this.blinkProgress < 1.0) {
              eyeOpen = Math.min(1.0, (this.blinkProgress - 0.45) / 0.55);
            } else {
              if (this.isDoubleBlink && !this.doubleBlinkPending) {
                this.doubleBlinkPending = true;
                this.blinkProgress = 0.15;
              } else {
                this.isBlinking = false;
                this.doubleBlinkPending = false;
                this.blinkTimer = 0.0;
                this.nextBlink = 2.4 + Math.random() * 3.6;
                eyeOpen = 1.0;
              }
            }
          }
        }

        // Apply emotional eye aperture modifiers
        const finalEyeOpen = Math.max(0.0, Math.min(1.9, eyeOpen + emo.eyeOpenOffset + act.eyeOpenBonus));

        // 5. Respiración Orgánica Multi-Armónica
        const breatheSpeed = isSleep ? 0.95 : 1.55;
        this.breathePhase += dt * breatheSpeed;
        const baseBreath = (Math.sin(this.breathePhase) + 1.0) * 0.5;
        const finalBreath = Math.max(0.0, Math.min(1.0, baseBreath + act.breathBonus));

        // 6. Aplicar Parámetros Directos con Acceso Indexado O(1)
        // Ojos y Expresión
        this.setParam('ParamEyeLOpen', finalEyeOpen);
        this.setParam('ParamEyeROpen', finalEyeOpen);
        this.setParam('ParamEyeBallX', this.gaze.currentGaze.x * 0.88);
        this.setParam('ParamEyeBallY', this.gaze.currentGaze.y * 0.82);

        const isWatchingFirefly = (this.gaze.mode === 'FIREFLY' && !isSleep);
        const fireflySmileBonus = isWatchingFirefly ? 0.22 : 0.0;
        const smileEyeVal = Math.max(0.0, Math.min(1.0, emo.eyeSmile + act.eyeSmileBonus + fireflySmileBonus + (isSpeaking ? 0.3 : 0.0)));
        this.setParam('ParamEyeLSmile', smileEyeVal);
        this.setParam('ParamEyeRSmile', smileEyeVal);
        this.setParam('ParamEyeSmile_Happy_L', Math.max(0.0, Math.min(1.0, emo.eyeHappy + act.eyeSmileBonus)));
        this.setParam('ParamEyeSmile_Happy_R', Math.max(0.0, Math.min(1.0, emo.eyeHappy + act.eyeSmileBonus)));
        this.setParam('ParamEyeSmile_Angry_L', emo.eyeAngry);
        this.setParam('ParamEyeSmile_Angry_R', emo.eyeAngry);
        this.setParam('ParamEyeCircles', emo.eyeCircles);

        // Expresiones especiales
        this.setParam('ParamExpression_1', emo.expression1);
        this.setParam('ParamExpression_2', emo.expression2);
        this.setParam('ParamExpression_3', Math.max(0.0, Math.min(1.0, emo.expression3 + act.exp3Bonus)));
        this.setParam('ParamExpression_4', emo.expression4);

        // Cejas
        this.setParam('ParamBrowLY', Math.max(-1.0, Math.min(1.0, emo.browY + emo.browAsymY)));
        this.setParam('ParamBrowRY', Math.max(-1.0, Math.min(1.0, emo.browY - emo.browAsymY * 0.5)));
        this.setParam('ParamBrowLAngle', emo.browAngle);
        this.setParam('ParamBrowRAngle', emo.browAngle);
        this.setParam('ParamBrowLForm', emo.browForm);
        this.setParam('ParamBrowRForm', emo.browForm);

        // Boca y Lengua
        const finalMouthOpen = Math.max(0.0, Math.min(2.0, this.mouthCurrent + emo.mouthOpenOffset + act.mouthOpenBonus));
        const finalMouthForm = Math.max(-1.0, Math.min(1.0, this.currentFormant + act.mouthFormBonus));
        this.setParam('ParamMouthOpenY', finalMouthOpen);
        this.setParam('ParamMouthForm', finalMouthForm);
        this.setParam('ParamMouthX', emo.mouthX);
        this.setParam('ParamTongueOut', Math.max(0.0, Math.min(1.0, emo.tongueOut + act.tongueBonus)));

        // Mejillas y Rubor
        this.setParam('ParamCheek', Math.max(0.0, Math.min(1.0, emo.cheek + act.cheekBonus)));
        const finalPuff = Math.max(0.0, Math.min(1.0, emo.cheekPuff + act.cheekPuffBonus));
        this.setParam('ParamCheekPuff', finalPuff);
        this.setParam('ParamCheekPuff2', finalPuff);

        // Cabeza y Cuello (Ángulos 3D combinados)
        let headAngX = 0.0;
        let headAngY = 0.0;
        let headAngZ = 0.0;
        if (isSleep) {
          headAngX = Math.sin(now * 0.55) * 2.0;
          headAngY = -13.0 + Math.sin(now * 0.7) * 1.5;
          headAngZ = -5.0;
          this.setParam('ParamAngleX', headAngX);
          this.setParam('ParamAngleY', headAngY);
          this.setParam('ParamAngleZ', headAngZ);
          this.setParam('ParamBodyAngleX', 0.0);
          this.setParam('ParamBodyAngleY', -4.0);
          this.setParam('ParamBodyAngleZ', -2.0);
          this.setParam('ParamPosition_Z', 0.0);
        } else {
          const speakNod = isSpeaking ? (Math.sin(now * 12.0) * this.smoothedAmp * 4.2) : 0.0;
          const totalAngleX = Math.max(-30.0, Math.min(30.0, this.gaze.headCurrent.x + act.angleX + gst.headAngleX));
          const totalAngleY = Math.max(-30.0, Math.min(30.0, this.gaze.headCurrent.y + emo.headPitchOffset + act.angleY + gst.headAngleY - speakNod));
          const totalAngleZ = Math.max(-30.0, Math.min(30.0, this.gaze.headCurrent.z + emo.headTiltOffset + act.angleZ + gst.headAngleZ));
          headAngX = totalAngleX;
          headAngY = totalAngleY;
          headAngZ = totalAngleZ;

          this.setParam('ParamAngleX', totalAngleX);
          this.setParam('ParamAngleY', totalAngleY);
          this.setParam('ParamAngleZ', totalAngleZ);

          // Cuerpo y Postura Articulada
          const totalBodyX = Math.max(-10.0, Math.min(10.0, (this.gaze.currentGaze.x * 9.0) + act.bodyX + gst.bodyAngleX));
          const totalBodyY = Math.max(-10.0, Math.min(10.0, (this.gaze.currentGaze.y * 6.0) + act.bodyY + gst.bodyAngleY));
          const totalBodyZ = Math.max(-10.0, Math.min(10.0, (this.gaze.currentGaze.x * -4.0) + act.bodyZ + flt.bodyTiltZ + gst.bodyAngleZ));

          this.setParam('ParamBodyAngleX', totalBodyX);
          this.setParam('ParamBodyAngleY', totalBodyY);
          this.setParam('ParamBodyAngleZ', totalBodyZ);

          // Inclinación hacia adelante / profundidad
          // Clamp posZ a [-0.30, 0.30] para evitar que HuoHuo muestre la espalda
          this.setParam('ParamPosition_Z', Math.max(-0.30, Math.min(0.30, emo.bodyLeanOffset + act.posZ + gst.posZ)));
        }

        // Hombros y Brazos (Compatibilidad cruzada: Edith + Huohuo)
        const totalShoulderL = gst.shoulderL + (act.shoulderL || 0.0);
        const totalShoulderR = gst.shoulderR + (act.shoulderR || 0.0);
        this.setCoreParam('ParamAngle_ShoulderL', totalShoulderL, ['Param7']);
        this.setCoreParam('ParamAngle_ShoulderR', totalShoulderR, ['Param8']);

        // Física y Deformación Dinámica de Brazos
        const totalArmL = gst.armL + (act.armL || 0.0);
        const totalArmR = gst.armR + (act.armR || 0.0);
        this.setCoreParam('ParamArmPhysics_L1', totalArmL, ['Param93', 'Param94']);
        this.setCoreParam('ParamArmPhysics_L2', totalArmL * 0.85, ['Param94']);
        this.setCoreParam('ParamArmPhysics_L3', totalArmL * 0.65, ['Param95']);
        this.setCoreParam('ParamArmPhysics_R1', totalArmR, ['Param93', 'Param94']);
        this.setCoreParam('ParamArmPhysics_R2', totalArmR * 0.85, ['Param94']);
        this.setCoreParam('ParamArmPhysics_R3', totalArmR * 0.65, ['Param95', 'Param124']);

        this.setCoreParam('ParamArmBPhysics_L1', gst.armBL + (act.armBL || 0.0), ['Param94']);
        this.setCoreParam('ParamArmBPhysics_L2', (gst.armBL + (act.armBL || 0.0)) * 0.80);
        this.setCoreParam('ParamArmBPhysics_R1', gst.armBR + (act.armBR || 0.0), ['Param94']);
        this.setCoreParam('ParamArmBPhysics_R2', (gst.armBR + (act.armBR || 0.0)) * 0.80);

        // Dinámica y Amplitud de Mangas
        const totalSleeveL = gst.sleeveL + (act.sleeveL || 0.0);
        const totalSleeveR = gst.sleeveR + (act.sleeveR || 0.0);
        this.setCoreParam('ParamSleevePhysics_L1', totalSleeveL, ['Param60']);
        this.setCoreParam('ParamSleevePhysics_L2', totalSleeveL * 0.85);
        this.setCoreParam('ParamSleevePhysics_R1', totalSleeveR, ['Param62']);
        this.setCoreParam('ParamSleevePhysics_R2', totalSleeveR * 0.85);
        this.setCoreParam('ParamSleeveLPhysics_L1', gst.sleeveLL + (act.sleeveLL || 0.0));
        this.setCoreParam('ParamSleeveLPhysics_R1', gst.sleeveLR + (act.sleeveLR || 0.0));

        // Torsión y Articulación de Pecho, Caderas y Columna
        this.setCoreParam('ParamAngle_ChestZ', flt.chestTiltZ + gst.chestZ + (act.chestZ || 0.0), ['Param9', 'Param12']);
        this.setCoreParam('ParamAngle_HipZ', flt.hipTiltZ + gst.hipZ + (act.hipZ || 0.0), ['Param10', 'Param11']);

        // Posición general del modelo con desplazamiento de presentación y flotación holográfica continua
        this.currentPresentationOffset += (this.targetPresentationOffset - this.currentPresentationOffset) * Math.min(1.0, dt * 5.0);
        this.model.x = this.baseX + this.currentPresentationOffset + act.posX + flt.floatX + gst.posX;
        this.model.y = this.baseY - act.posY + flt.floatY + gst.posY;
        this.model.scale.set(this.baseScale * flt.floatScale);

        // Respiración en cascada
        this.setCoreParam('ParamBreath', finalBreath);
        this.setCoreParam('ParamBreath2', Math.max(0.0, Math.min(1.0, (Math.sin(this.breathePhase * 1.02) + 1.0) * 0.5 + act.breathBonus)));
        this.setCoreParam('ParamBreath3', Math.max(0.0, Math.min(1.0, (Math.sin(this.breathePhase * 0.98) + 1.0) * 0.5 + act.breathBonus)));

        // 7. Video Game Suite: RPG Stance, Props, Wings, Tail, Ears, Doll, FX
        if (this.gameMotion) {
          const gm = this.gameMotion;

          // RPG Stance weight shifting: feet and hips
          this.setCoreParam('ParamAngle_Foot_L', gm.footAngleL);
          this.setCoreParam('ParamAngle_Foot_R', gm.footAngleR);
          this.setCoreParam('ParamAngle_HipUp', gm.hipUp);
          this.setCoreParam('ParamAngle_HipDown', gm.hipDown);

          // Props: Grimoire / Tablet / Peluche / Bandera (Edith + Huohuo) - Desactivado
          this.setCoreParam('ParamBook1', 0.0, ['Param99', 'Param63', 'Param127']);
          this.setCoreParam('ParamBook2', 0.0);

          // Props: Holographic 3D Rings & Glyphs / Luces Mágicas (Edith + Huohuo)
          const rings = gm.props.hologramRings;
          this.setCoreParam('Ring_Rotate', rings.rot * rings.value, ['Param102', 'Param103', 'Param104']);
          this.setCoreParam('Ring_Flip', rings.flip * rings.value);
          this.setCoreParam('Ring_Perspective', rings.persp * rings.value);
          for (let c = 1; c <= 4; c++) {
            this.setCoreParam(`Circle_Rotate_${c}`, rings.circles[c - 1] * rings.value);
          }
          for (let c = 1; c <= 3; c++) {
            this.setCoreParam(`Circle_Posizion_${c}`, rings.value);
          }
          for (let c = 1; c <= 6; c++) {
            this.setCoreParam(`Circle_Flip${c}`, rings.flip * rings.value);
          }

          // Props: Jibril-style Rotating Anime Light Halo - Desactivado
          this.setCoreParam('fire', 0.0, ['Param105']);

          // Expression Tremors / Anime FX
          if (gm.pupilQuake > 0.01) {
            const qk = (Math.random() - 0.5) * gm.pupilQuake * 2.0;
            this.setCoreParam('ParamPupilQuake_L1', qk);
            this.setCoreParam('ParamPupilQuake_R1', qk);
          }

          // Hat Ears Twitching
          this.setCoreParam('ParamHatEar_L1', gm.earTwitchL);
          this.setCoreParam('ParamHatEar_L2', gm.earTwitchL * 0.8);
          this.setCoreParam('ParamHatEar_L3', gm.earTwitchL * 0.6);
          this.setCoreParam('ParamHatEar_R1', gm.earTwitchR);
          this.setCoreParam('ParamHatEar_R2', gm.earTwitchR * 0.8);
          this.setCoreParam('ParamHatEar_R3', gm.earTwitchR * 0.6);

          // Fantasy Wings Flutter
          for (let w = 1; w <= 4; w++) {
            const wVal = gm.wings[w - 1];
            this.setCoreParam(`ParamWingPhysics_L${w}`, wVal);
            this.setCoreParam(`ParamWingPhysics_R${w}`, -wVal);
          }

          // Fantasy Tail Sinusoidal Propagation (Edith + Huohuo)
          for (let tl = 1; tl <= 7; tl++) {
            const tlVal = gm.tailNodes[tl - 1];
            this.setCoreParam(`ParamTailPhysics_L${tl}`, tlVal, ['Param100', 'Param115']);
            this.setCoreParam(`ParamTailPhysics_R${tl}`, tlVal, ['Param100', 'Param115']);
          }

          // Living Mascot Doll Companion (Safe Parameter Mapping)
          const doll = gm.doll;
          this.setCoreParam('ParamDollPhysics_X', doll.x);
          this.setCoreParam('ParamDollPhysics_Y', doll.y);
          this.setCoreParam('ParamDollPhysics_Z', doll.z);
          this.setCoreParam('ParamDollAngle_L', doll.angleL);
          this.setCoreParam('ParamDollAngle_R', doll.angleR);
          this.setCoreParam('ParamDollEarPhysics_L', doll.earL);
          this.setCoreParam('ParamDollEarPhysics_R', doll.earR);
          this.setCoreParam('ParamDollTailPhysics', doll.tail);
          this.setCoreParam('ParamDollArmPhysics', doll.arm);
        }

        // 8. Renderizar Capa de Superposición (Halo de Luz Jibril + Luciérnaga + Ondas Táctiles)
        if (this.firefly) {
          try {
            this.firefly.render(this.state);
          } catch (e) {
            console.warn("Firefly/Halo render error:", e);
          }
        }
      }

      updateDebugHud() {
        if (!this.debugHud) return;
        const st = this.getStatus();
        this.debugHud.innerHTML = `
          <b>EDITH LIVE2D ENGINE</b> [${st.fps} FPS]<br>
          <b>State:</b> ${st.state} | <b>Mood:</b> ${st.mood}<br>
          <b>Emotion:</b> ${st.emotion} (${(st.emotionIntensity * 100).toFixed(0)}%)<br>
          <b>Gaze:</b> ${st.gazeMode}<br>
          <b>Action:</b> ${st.activeAction || 'NONE'} | <b>Gesture:</b> ${st.activeGesture || 'NONE'}<br>
          <b>Float:</b> ${st.floatElevation}px<br>
          <b>Autonomy:</b> ${st.autonomyEnabled ? 'ON' : 'OFF'} (${st.spontaneityLevel.toFixed(1)}x)<br>
          <b>Voice:</b> ${st.speaking ? 'SPEAKING' : 'SILENT'} (Amp: ${(st.amplitude).toFixed(2)})
        `;
      }
    }

    // Instancia global
    window.live2dApp = new EdithLive2DApp();
  </script>
</body>
</html>
