<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VIERNES — Acceso Remoto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #06080f;
      --card-bg: rgba(13, 18, 30, 0.75);
      --card-border: rgba(0, 229, 255, 0.2);
      --accent-cyan: #00e5ff;
      --accent-blue: #0077ff;
      --accent-green: #10b981;
      --text-main: #f1f5f9;
      --text-muted: #64748b;
      --text-dim: #94a3b8;
      --danger: #f43f5e;
    }
    html, body {
      height: 100%;
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 15%, rgba(0, 229, 255, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(0, 119, 255, 0.08) 0%, transparent 50%),
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
      color: var(--text-main);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }
    .card {
      width: 100%;
      max-width: 380px;
      padding: 40px 28px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      text-align: center;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 229, 255, 0.06);
      position: relative;
      overflow: hidden;
      animation: floatIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
    }
    @keyframes floatIn {
      from { opacity: 0; transform: translateY(18px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      background: rgba(0, 229, 255, 0.08);
      border: 1px solid rgba(0, 229, 255, 0.25);
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--accent-cyan);
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-cyan);
      box-shadow: 0 0 8px var(--accent-cyan);
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .logo {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 6px;
      margin-bottom: 4px;
      background: linear-gradient(135deg, #ffffff 40%, var(--accent-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sub {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 22px;
      font-weight: 600;
    }
    .hint {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.5;
      margin-bottom: 26px;
    }
    .hint strong {
      color: var(--accent-cyan);
      font-weight: 600;
    }
    .key-wrap {
      position: relative;
      margin-bottom: 12px;
    }
    .key-input {
      width: 100%;
      padding: 16px;
      background: rgba(6, 11, 24, 0.85);
      border: 1.5px solid rgba(0, 229, 255, 0.25);
      border-radius: 16px;
      color: var(--accent-cyan);
      font-size: 32px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      text-align: center;
      letter-spacing: 12px;
      text-transform: uppercase;
      outline: none;
      transition: all 0.25s ease;
      caret-color: var(--accent-cyan);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
    }
    .key-input::placeholder {
      color: rgba(100, 116, 139, 0.35);
      letter-spacing: 8px;
      font-size: 24px;
    }
    .key-input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.25), inset 0 2px 6px rgba(0, 0, 0, 0.5);
      background: rgba(9, 17, 34, 0.95);
    }
    .err {
      font-size: 12px;
      color: var(--danger);
      min-height: 20px;
      margin-bottom: 16px;
      font-weight: 500;
    }
    .btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 114, 255, 0.35);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn:active {
      transform: scale(0.98);
      box-shadow: 0 4px 12px rgba(0, 114, 255, 0.25);
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake { animation: shake 0.35s ease; }
    .footer-note {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .footer-note svg {
      width: 14px;
      height: 14px;
      stroke: var(--accent-green);
    }
    #reconnecting {
      display: none;
      color: var(--accent-cyan);
      font-size: 12px;
      margin-bottom: 16px;
      font-weight: 600;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="brand-pill">
      <span class="pulse-dot"></span>
      TERMINAL REMOTO V5.0
    </div>
    <div class="logo">VIERNES</div>
    <div class="sub">Executive Command Center</div>
    <p id="reconnecting">Reconectando dispositivo vinculado…</p>
    <p class="hint">Ingresa el <strong>PIN de 6 caracteres</strong> mostrado en el panel de VIERNES en tu PC o escanea el código QR.</p>
    <div class="key-wrap">
      <input class="key-input" id="key" type="text" maxlength="6"
             autocomplete="off" autocorrect="off" spellcheck="false"
             placeholder="······">
    </div>
    <div class="err" id="err"></div>
    <button class="btn" onclick="doLogin()">Vincular Terminal</button>
    
    <div class="footer-note">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
      </svg>
      Canal Encriptado de Grado Militar (AES-256)
    </div>
  </div>

  <script>
    // Try auto-reconnect with stored device token (set on first QR login)
    (async function() {
      const devTok = localStorage.getItem('viernes_device_token');
      if (!devTok) return;
      document.getElementById('reconnecting').style.display = 'block';
      try {
        const r = await fetch('/api/device-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ device_token: devTok }),
        });
        const d = await r.json();
        if (d.ok && d.token) {
          sessionStorage.setItem('viernes_key', d.key);
          sessionStorage.setItem('viernes_token', d.token);
          location.replace('/');
          return;
        }
      } catch (_) {}
      localStorage.removeItem('viernes_device_token');
      document.getElementById('reconnecting').style.display = 'none';
    })();

    const inp = document.getElementById('key');
    inp.focus();

    inp.addEventListener('input', () => {
      inp.value = inp.value.toUpperCase().replace(/[^A-Z2-9]/g, '');
      if (inp.value.length === 6) doLogin();
    });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    async function doLogin() {
      const key = inp.value.trim();
      if (key.length < 6) { shake(); return; }
      let data;
      try {
        const r = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: key })
        });
        data = await r.json();
      } catch (e) {
        document.getElementById('err').textContent = 'Error de conexión con el host';
        shake(); return;
      }
      if (data.ok && data.token) {
        sessionStorage.setItem('viernes_key', key);
        sessionStorage.setItem('viernes_token', data.token);
        if (navigator.vibrate) navigator.vibrate([20]);
        location.href = '/';
      } else {
        inp.value = '';
        inp.focus();
        document.getElementById('err').textContent = 'Clave inválida o expirada';
        shake();
      }
    }

    function shake() {
      const c = document.getElementById('card');
      c.classList.remove('shake');
      void c.offsetWidth;
      c.classList.add('shake');
      if (navigator.vibrate) navigator.vibrate([40, 40, 40]);
    }
  </script>
</body>
</html>
